/* ===== src/core/scoring.js =============================================== */
/* ============================================================================
   99WORLDCUP — RUN VALIDATION
   ----------------------------------------------------------------------------
   WHAT THIS IS: a plausibility gate. A run that clears it is *possible*. That
   is the strongest claim anything running inside the player's own browser can
   make, and the Rules page says so in those words.

   WHAT THIS IS NOT: proof. Proof needs the seed to be issued by a server and
   the run to be re-simulated there from the recorded input. The games are pure
   and seeded precisely so that becomes a small job later — see core/backend.js.

   Four outcomes, and only four:
     accepted — goes on the board
     review   — possible but outside the expected envelope; held back
     rejected — internally inconsistent; cannot be counted
     expired  — the session was not live any more
   ========================================================================== */

const VERDICT = {
  accepted:{ title:'SCORE ACCEPTED',    css:'verdict--ok' },
  review:  { title:'SCORE UNDER REVIEW', css:'verdict--review' },
  rejected:{ title:'SCORE REJECTED',     css:'verdict--bad' },
  expired: { title:'SESSION EXPIRED',    css:'verdict--bad' }
};

/* Player-facing copy. Deliberately vague about *which* check fired: naming the
   exact rule would hand a cheater the shape of the envelope. */
const NOTE = {
  accepted:'This run counts.',
  review  :'This run scored faster than the game is expected to allow, so it is being held back while it is looked at.',
  rejected:'This run did not match the session it started from, so it cannot be counted.',
  expired :'This run was no longer part of a live session. Start a new game.'
};

const MAX_SESSION_MS = 4 * 3600e3;

/**
 * @param session {sid, seed, game, gameVersion, configVersion, startedAt, spent}
 * @param run     {score, endedAt, seed, gameVersion, configVersion, playMs, log}
 */
function validateRun(session, run){
  const g = GAMES[session.game];
  const out = (verdict, code) => ({ verdict, code, note:NOTE[verdict], title:VERDICT[verdict].title });
  if (!g) return out('rejected','UNKNOWN_GAME');

  /* --- session liveness ------------------------------------------------- */
  if (session.spent)                                    return out('rejected','SESSION_REUSED');
  if (!Season.isOpen(S) || run.endedAt >= SI().end)      return out('expired','SEASON_CLOSED');
  if (run.endedAt - session.startedAt > MAX_SESSION_MS)  return out('expired','SESSION_STALE');
  if (run.endedAt < session.startedAt)                   return out('rejected','CLOCK_BACKWARDS');

  /* --- the number itself ------------------------------------------------ */
  if (typeof run.score !== 'number' || !isFinite(run.score)) return out('rejected','SCORE_NOT_A_NUMBER');
  if (run.score !== Math.floor(run.score))                   return out('rejected','SCORE_NOT_INTEGER');
  if (run.score < 0 || run.score > 1e7)                       return out('rejected','SCORE_OUT_OF_RANGE');

  /* --- does the run belong to this session? ----------------------------- */
  if (run.seed !== session.seed)                        return out('rejected','SEED_MISMATCH');
  if (run.gameVersion !== g.v)                          return out('rejected','GAME_VERSION');
  if (run.configVersion !== g.cfgV)                     return out('rejected','CONFIG_VERSION');

  /* --- the score log: monotonic, and it ends where it claims ------------ */
  const log = run.log || [];
  for (let i = 1; i < log.length; i++)
    if (log[i] < log[i - 1])                            return out('rejected','SCORE_DECREASED');
  if (log.length && log[log.length - 1] !== run.score)   return out('rejected','LOG_TAIL');

  /* --- time. playMs is counted in fixed 60 Hz steps, so pausing, blurring
         or sitting on the start screen cannot inflate or deflate it. ------ */
  const playMs = run.playMs || 0;
  if (playMs < 0)                                       return out('rejected','NEGATIVE_PLAYTIME');
  if (playMs > (run.endedAt - session.startedAt) + 2000) return out('rejected','PLAYTIME_EXCEEDS_CLOCK');

  /* Everything below is "unlikely", not "impossible" — so it is held for
     review rather than thrown away. A human decides, not this function. */
  const lim = g.limits;
  if (run.score > 0 && playMs < lim.minMs)               return out('review','TOO_SHORT');
  if (run.score > (playMs / 1000) * lim.maxRate + lim.grace) return out('review','RATE');

  return out('accepted','OK');
}


/* ===== src/core/rng.js =================================================== */
/* ============================================================================
   99WORLDCUP — DETERMINISM
   mulberry32. A session seed produces the identical obstacle stream on every
   device, which is what makes a run reproducible — and therefore checkable by
   a server that knows the seed. Do not replace this with Math.random().
   ========================================================================== */

function rng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Cheap run-log digest. Evidence, not security: it is printed on the
 *  game-over card so a player can quote a specific run in a dispute. */
function fnv1a(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
}


/* ===== src/core/backend.js =============================================== */
/* ============================================================================
   99WORLDCUP — BACKEND ADAPTER
   ============================================================================
   THIS FILE IS THE LINE BETWEEN PROTOTYPE AND PRODUCTION. Read it before you
   claim anything about the integrity of a score.

   MODE 'prototype'  (what ships today)
     The browser issues its own session seed, plays the run, validates it with
     core/scoring.js and writes the result to the shared store. The client is
     therefore both the player and the referee. The checks catch impossible and
     accidental scores. They do not stop somebody with developer tools, and
     nothing in this interface ever claims they do.

   MODE 'server'  (what production needs)
     configureBackend({ baseUrl }) switches every call below to HTTP:
        POST /session/start  -> { sid, seed, game, gameVersion, configVersion,
                                  startedAt, expiresAt }      seed unguessable,
                                                              sid single-use
        POST /run/submit     -> { verdict, note, rank, digest }
     The server re-simulates the run from (seed, input log) with the same pure
     game modules in src/games and compares the score it reaches with the score
     that was submitted. That is the only version of this that is actually
     enforceable, and it is a small job precisely because the games are pure.

   Nothing here fakes the second mode. If baseUrl is not configured, the app
   says "prototype" everywhere it matters.
   ========================================================================== */

const Backend = { mode:'prototype', baseUrl:null };

function configureBackend(opts){
  Backend.baseUrl = (opts && opts.baseUrl) || null;
  Backend.mode = Backend.baseUrl ? 'server' : 'prototype';
  return Backend.mode;
}
const isPrototype = () => Backend.mode === 'prototype';

function randomSeed(){
  const buf = new Uint32Array(2);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
  else { buf[0] = Math.random() * 2 ** 32; buf[1] = Math.random() * 2 ** 32; }
  return buf;
}

/* --------------------------------------------------------------------------
   START A COMPETITIVE SESSION
   -------------------------------------------------------------------------- */
async function startSession(gameKey){
  const g = GAMES[gameKey];
  if (!g) return { error:'UNKNOWN_GAME' };
  if (!SI().live) return { error:'SEASON_CLOSED' };

  if (Backend.mode === 'server'){
    const r = await fetch(Backend.baseUrl + '/session/start', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body:JSON.stringify({ game:gameKey, season:S.id })
    });
    if (!r.ok) return { error:'SESSION_REFUSED' };
    return await r.json();
  }

  /* [PROTOTYPE] The browser is trusted to generate this. A server must not be. */
  const buf = randomSeed();
  return {
    sid:'s_' + buf[0].toString(36) + buf[1].toString(36),
    seed:buf[0] >>> 0,
    season:S.id, game:g.key, gameVersion:g.v, configVersion:g.cfgV,
    startedAt:Date.now(), spent:false, local:true
  };
}

/* --------------------------------------------------------------------------
   SUBMIT A FINISHED RUN
   Returns { verdict, note, title, digest, written, pb, dailyPb, prevBest }
   -------------------------------------------------------------------------- */
async function submitRun(session, run){
  const digest = fnv1a([session.sid, session.seed, run.score, run.endedAt,
                        (run.log || []).join(',')].join('|'));

  if (Backend.mode === 'server'){
    const r = await fetch(Backend.baseUrl + '/run/submit', {
      method:'POST', headers:{ 'content-type':'application/json' },
      body:JSON.stringify({ sid:session.sid, run })
    });
    if (!r.ok) return { verdict:'expired', title:'SESSION EXPIRED',
                        note:'This run was no longer part of a live session. Start a new game.',
                        digest, written:false };
    return Object.assign({ digest }, await r.json());
  }

  /* --- prototype path ---------------------------------------------------
     Validate FIRST, then burn the session. Marking it spent up front made
     every submission fail its own reuse check — the bug that sent legitimate
     scores to review. Order matters here; do not reorder these two lines. */
  const v = validateRun(session, run);
  session.spent = true;

  if (v.verdict !== 'accepted'){
    App.flagged.push({ game:session.game, score:run.score, verdict:v.verdict,
                       note:v.note, at:run.endedAt, digest });
    return Object.assign({ digest, written:false }, v);
  }

  const g = session.game, day = utcDay(run.endedAt);
  const prevBest  = App.me[g + '_b'] || 0;
  const sameDay   = App.me[g + '_d'] === day;
  const prevToday = sameDay ? (App.me[g + '_t'] || 0) : 0;

  const patch = {
    games:(App.me.games || 0) + 1,
    [g + '_n']:(App.me[g + '_n'] || 0) + 1,
    [g + '_d']:day,
    [g + '_t']:Math.max(prevToday, run.score)
  };
  if (run.score > prevBest){ patch[g + '_b'] = run.score; patch[g + '_bt'] = run.endedAt; }

  let written = true;
  try { const r = await App.savePlayer(patch); written = r.ok; }
  catch (e){ written = false; }

  return Object.assign({ digest, written, prevBest,
                         pb:run.score > prevBest, dailyPb:run.score > prevToday }, v);
}


/* ===== src/games/skyhop.js =============================================== */
/* ============================================================================
   99WORLDCUP — SKY HOP  (one button)
   A pure module: given a seeded RNG it produces an identical run for identical
   input. No DOM, no Date.now(), no Math.random(), no network. That is what
   makes a run reproducible — and therefore checkable by a server later.
   Original artwork and tuning; the genre is a classic, the assets are not.
   ========================================================================== */

function skyhop(rand){
  const W = 320, H = 480, GY = H - 68, BX = 94, BR = 11, PW = 48;
  const gapFor   = n => Math.max(98, 142 - n * 1.15);
  const speedFor = n => Math.min(4.3, 2.15 + n * 0.022);
  const spaceFor = n => Math.max(146, 194 - n * 1.1);

  let y = H * .40, vy = 0, pipes = [], passed = 0, t = 0, started = false;
  const g = { w: W, h: H, score: 0, dead: false };

  function spawn() {
    const gap = gapFor(passed + pipes.length);
    const top = 52 + rand() * (GY - 104 - gap);
    pipes.push({ x: W + 30, top, gap, scored: false });
  }
  spawn();

  g.update = function (input) {
    t++;
    if (!started) {
      if (input.takeTap()) { started = true; vy = -6.7; }
      else { y = H * .40 + Math.sin(t / 17) * 7; return; }
    }
    if (input.takeTap()) vy = -6.7;
    vy = Math.min(vy + 0.42, 10.6);
    y += vy;

    const sp = speedFor(passed);
    for (const p of pipes) p.x -= sp;
    if (!pipes.length || pipes[pipes.length - 1].x < W - spaceFor(passed)) spawn();
    while (pipes.length && pipes[0].x < -PW - 10) pipes.shift();

    if (y - BR < 0) { y = BR; vy = 0; }
    if (y + BR >= GY) { y = GY - BR; g.dead = true; return; }

    for (const p of pipes) {
      if (BX + BR > p.x && BX - BR < p.x + PW &&
          (y - BR < p.top || y + BR > p.top + p.gap)) { g.dead = true; return; }
      if (!p.scored && p.x + PW < BX - BR) { p.scored = true; passed++; g.score++; }
    }
  };


  /* Re-simulation hook. A compact numeric fingerprint of the current state.
     A server replaying (seed, input log) can compare traces frame by frame and
     find the exact step where a submitted run stops being real. Nothing in the
     interface reads this; it exists for the checker and for the tests. */
  g.trace = () => [Math.round(y), Math.round(vy * 10), pipes.length,
                   pipes.length ? Math.round(pipes[0].x) : 0,
                   pipes.length ? Math.round(pipes[0].top) : 0, g.score];

  g.render = function (c) {
    const sky = c.createLinearGradient(0, 0, 0, GY);
    sky.addColorStop(0, '#0B1C3D'); sky.addColorStop(.55, '#123A6B'); sky.addColorStop(1, '#2A6EA8');
    c.fillStyle = sky; c.fillRect(0, 0, W, GY);

    /* skyline: deterministic from x, so it never shimmers */
    c.fillStyle = '#0A1730';
    for (let i = 0; i < 14; i++) {
      const bw = 26 + (i * 37 % 19), bh = 40 + (i * 53 % 66);
      c.fillRect((i * 43 - (t * .22) % 602 + 602) % 602 - 141, GY - 68 - bh, bw, bh + 68);
    }
    c.fillStyle = 'rgba(255,201,28,.20)';
    for (let i = 0; i < 26; i++) {
      const bx = (i * 61 - (t * .22) % 602 + 602) % 602 - 141;
      c.fillRect(bx + 6, GY - 92 - (i * 29 % 50), 4, 5);
    }

    for (const p of pipes) {
      const x = Math.round(p.x), top = Math.round(p.top), gap = Math.round(p.gap);
      c.fillStyle = '#3FA34D'; c.fillRect(x, 0, PW, top);
      c.fillRect(x, top + gap, PW, GY - top - gap);
      c.fillStyle = '#5ED16C';
      c.fillRect(x + 4, 0, 7, top); c.fillRect(x + 4, top + gap, 7, GY - top - gap);
      c.fillStyle = '#2F7C3A';
      c.fillRect(x - 4, top - 16, PW + 8, 16);
      c.fillRect(x - 4, top + gap, PW + 8, 16);
      c.fillStyle = '#1E5527';
      c.fillRect(x - 4, top - 4, PW + 8, 4); c.fillRect(x - 4, top + gap + 12, PW + 8, 4);
    }

    c.fillStyle = '#2D6B3C'; c.fillRect(0, GY, W, H - GY);
    c.fillStyle = '#245A31';
    for (let i = 0; i < 12; i++) c.fillRect(((i * 34 - t * 2.2) % 374 + 374) % 374 - 27, GY + 10, 18, 6);
    c.fillStyle = '#1B4526'; c.fillRect(0, GY, W, 4);

    const tilt = clamp(vy / 13, -.45, 1.0);
    c.save(); c.translate(BX, Math.round(y)); c.rotate(tilt);
    c.fillStyle = '#FFC91C'; c.fillRect(-11, -9, 20, 17);
    c.fillStyle = '#FFE07A'; c.fillRect(-11, -9, 20, 5);
    c.fillStyle = '#E88F14';
    c.fillRect(-9, started && Math.floor(t / 6) % 2 ? -1 : 2, 10, 6);   // wing
    c.fillStyle = '#FF8A1C'; c.fillRect(9, -2, 7, 5);                    // beak
    c.fillStyle = '#FFF'; c.fillRect(2, -6, 6, 6);
    c.fillStyle = '#000'; c.fillRect(5, -4, 3, 3);
    c.restore();

    if (!started) {
      c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(0, H / 2 - 26, W, 40);
      c.fillStyle = '#FFC91C'; c.font = '11px "Press Start 2P", monospace'; c.textAlign = 'center';
      c.fillText('TAP TO HOP', W / 2, H / 2);
      c.textAlign = 'left';
    }
  };
  return g;
}


/* ===== src/games/walldrift.js ============================================ */
/* ============================================================================
   99WORLDCUP — WALL DRIFT  (one paddle)
   The ball outgrows the paddle on purpose: past roughly seventy rallies its
   vertical speed exceeds what a paddle can travel, so no amount of tracking
   keeps a player alive forever. Every run has to end, which is what makes the
   score mean something.
   ========================================================================== */

function walldrift(rand){
  const W = 440, H = 300, PW = 8, PX = 18, AX = W - 18 - PW, R = 5;
  const PMAX = 10.5;                       // how fast a paddle can physically travel
  let py = H / 2, ay = H / 2, hits = 0, aiErr = 0, flash = 0, pts = 0;
  let b = { x: W / 2, y: H / 2, vx: -3.2, vy: (rand() * 2 - 1) * 1.8 };
  let trail = [];
  const g = { w: W, h: H, score: 0, dead: false };

  /* The ramp: the ball outgrows the paddle. Past roughly 70 rallies the ball's
     vertical speed exceeds PMAX, so no amount of tracking keeps you alive
     forever — the run has to end, which is what makes the score mean something. */
  const speed = () => Math.min(15.5, 3.2 + hits * 0.145);
  const ph    = () => Math.max(30, 56 - hits * 0.22);

  function serve(toPlayer) {
    b = { x: W / 2, y: H / 2, vx: (toPlayer ? -1 : 1) * speed() * .75,
          vy: (rand() * 2 - 1) * 2.4 };
    trail = [];
  }

  g.update = function (input) {
    if (flash > 0) flash--;
    const H2 = ph() / 2;
    if (input.py !== null && input.py !== undefined) py += clamp(input.py - py, -PMAX, PMAX);
    if (input.held.u) py -= PMAX * .7;
    if (input.held.d) py += PMAX * .7;
    py = clamp(py, H2, H - H2);

    const aiSp = Math.min(9.6, 2.7 + hits * 0.078);
    const want = b.vx > 0 ? b.y + aiErr : H / 2;
    if (ay < want - 2) ay = Math.min(ay + aiSp, want);
    else if (ay > want + 2) ay = Math.max(ay - aiSp, want);
    ay = clamp(ay, H2, H - H2);

    trail.push({ x: b.x, y: b.y }); if (trail.length > 8) trail.shift();
    b.x += b.vx; b.y += b.vy;
    if (b.y - R < 0) { b.y = R; b.vy = -b.vy; }
    if (b.y + R > H) { b.y = H - R; b.vy = -b.vy; }

    if (b.vx < 0 && b.x - R <= PX + PW && b.x - R > PX - 14 && Math.abs(b.y - py) < H2 + R) {
      hits++; g.score++; flash = 6;
      const rel = clamp((b.y - py) / H2, -1, 1), ang = rel * 0.95, s = speed();
      b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s; b.x = PX + PW + R;
      /* one fresh aim error per leg; the opponent sharpens as the rally grows */
      aiErr = (rand() * 2 - 1) * Math.max(2, 44 - hits * 1.4);
    }
    if (b.vx > 0 && b.x + R >= AX && b.x + R < AX + PW + 14 && Math.abs(b.y - ay) < H2 + R) {
      const rel = clamp((b.y - ay) / H2, -1, 1), ang = Math.PI - rel * 0.95, s = speed();
      b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s; b.x = AX - R;
    }
    if (b.x - R > W) { g.score += 25; pts++; flash = 16; serve(true); }
    if (b.x + R < 0) { g.dead = true; }
  };


  /* Re-simulation hook. A compact numeric fingerprint of the current state.
     A server replaying (seed, input log) can compare traces frame by frame and
     find the exact step where a submitted run stops being real. Nothing in the
     interface reads this; it exists for the checker and for the tests. */
  g.trace = () => [Math.round(b.x), Math.round(b.y), Math.round(b.vx * 10),
                   Math.round(b.vy * 10), Math.round(py), Math.round(ay), hits, g.score];

  g.render = function (c) {
    const H2 = ph() / 2;
    c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
    c.strokeStyle = '#242D4E'; c.lineWidth = 3; c.setLineDash([9, 11]);
    c.beginPath(); c.moveTo(W / 2, 0); c.lineTo(W / 2, H); c.stroke(); c.setLineDash([]);

    c.fillStyle = '#131B3B'; c.textAlign = 'center';
    c.font = '30px "Press Start 2P", monospace';
    c.fillText(String(g.score), W / 2, 52);
    if (pts) {
      c.font = '9px "Press Start 2P", monospace'; c.fillStyle = '#1E2A55';
      c.fillText(pts + (pts === 1 ? ' POINT PAST' : ' POINTS PAST'), W / 2, 72);
    }

    trail.forEach((t, i) => {
      c.fillStyle = 'rgba(232,240,255,' + (i / trail.length * .20) + ')';
      c.fillRect(Math.round(t.x) - R, Math.round(t.y) - R, R * 2, R * 2);
    });

    c.fillStyle = flash > 0 ? '#FFC91C' : '#E8F0FF';
    c.fillRect(PX, Math.round(py - H2), PW, Math.round(H2 * 2));
    c.fillStyle = '#7F93BC';
    c.fillRect(AX, Math.round(ay - H2), PW, Math.round(H2 * 2));
    c.fillStyle = '#FFF';
    c.fillRect(Math.round(b.x) - R, Math.round(b.y) - R, R * 2, R * 2);
    c.textAlign = 'left';
  };
  return g;
};


/* ===== src/games/mazesnap.js ============================================= */
/* ============================================================================
   99WORLDCUP — MAZE SNAP  (maze chase)
   Original 19x21 maze: two tunnels, four power pellets, a central pen with a
   ghost-only door. Entities live on (tile, progress-to-next-tile) rather than
   raw pixels, so there is no float drift and "may I turn here" is answered
   exactly once per tile.
   ========================================================================== */
const MAZE = [
  '###################',
  '#........#........#',
  '#o##.###.#.###.##o#',
  '#.................#',
  '#.##.#.#####.#.##.#',
  '#....#...#...#....#',
  '####.###.#.###.####',
  '   #.#.......#.#   ',
  '####.#.##-##.#.####',
  'T......#GGG#......T',
  '####.#.#####.#.####',
  '   #.#.......#.#   ',
  '####.#.#####.#.####',
  '#........#........#',
  '#.##.###.#.###.##.#',
  '#o.#.......P...#.o#',
  '##.#.#.#####.#.#.##',
  '#....#...#...#....#',
  '#.######.#.######.#',
  '#.................#',
  '###################'
];

function mazesnap(rand){
  const T = 16, COLS = 19, ROWS = 21, W = COLS * T, H = ROWS * T;
  const DV = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
  const OPP = { u: 'd', d: 'u', l: 'r', r: 'l' };

  const wall = [], pellet = [], power = [];
  let start = { c: 11, r: 15 }, pen = [];
  for (let r = 0; r < ROWS; r++) {
    wall[r] = []; pellet[r] = []; power[r] = [];
    for (let c = 0; c < COLS; c++) {
      const ch = MAZE[r][c];
      wall[r][c] = (ch === '#' || ch === ' ');
      pellet[r][c] = (ch === '.');
      power[r][c] = (ch === 'o');
      if (ch === 'P') start = { c, r };
      if (ch === 'G') pen.push({ c, r });
    }
  }
  const DOOR = { c: 9, r: 8 }, PEN = { c: 9, r: 9 }, EXIT = { c: 9, r: 7 };
  const total = pellet.flat().filter(Boolean).length + power.flat().filter(Boolean).length;
  let left = total;

  const wrapC = c => (c + COLS) % COLS;
  /* Can an entity standing on (c,r) move one tile in `dir`?
     The pen door is passable by ghosts only, which is what keeps the player out. */
  function open(c, r, dir, ghost) {
    const d = DV[dir], nr = r + d[1];
    if (nr < 0 || nr >= ROWS) return false;
    const nc = wrapC(c + d[0]);
    if (nc === DOOR.c && nr === DOOR.r) return !!ghost;
    return !wall[nr][nc];
  }

  /* Entities live on (tile, progress-to-next-tile). No float drift, no
     snap-back, and "am I allowed to turn" is answered exactly once per tile. */
  const ent = (c, r, dir) => ({ c, r, prog: 0, dir });
  const px = e => (e.c * T + T / 2) + DV[e.dir][0] * e.prog * T;
  const py = e => (e.r * T + T / 2) + DV[e.dir][1] * e.prog * T;

  function advance(e, tilesPerFrame, pick, ghost, onEnter) {
    let remain = tilesPerFrame, guard = 0;
    while (remain > 1e-6 && guard++ < 6) {
      if (e.prog === 0) {
        const d = pick(e);
        if (d && open(e.c, e.r, d, ghost)) e.dir = d;
        if (!open(e.c, e.r, e.dir, ghost)) return false;      // nose against a wall
      }
      const adv = Math.min(remain, 1 - e.prog);
      e.prog += adv; remain -= adv;
      if (e.prog >= 1 - 1e-9) {
        const v = DV[e.dir];
        e.c = wrapC(e.c + v[0]); e.r += v[1]; e.prog = 0;
        if (onEnter) onEnter(e);
      }
    }
    return true;
  }
  /* A reversal is legal anywhere, including mid-tile: flip into the tile ahead
     and invert the progress so the position on screen does not jump. */
  function reverse(e) {
    if (e.prog > 0) {
      const v = DV[e.dir];
      e.c = wrapC(e.c + v[0]); e.r += v[1]; e.prog = 1 - e.prog;
    }
    e.dir = OPP[e.dir];
  }

  const p = ent(start.c, start.r, 'l');
  let want = null;
  const GC = ['#FF2E3F', '#FF8AD0', '#3BD7FF', '#FF9E3D'];
  const CORNER = [{ c: 17, r: 1 }, { c: 1, r: 1 }, { c: 17, r: 19 }, { c: 1, r: 19 }];
  const ghosts = [0, 1, 2, 3].map(i => {
    const home = pen[Math.min(i, pen.length - 1)];
    const e = i === 0 ? ent(EXIT.c, EXIT.r, 'l') : ent(home.c, home.r, 'u');
    /* Release times and the scatter phase are drawn from the session seed, so
       two sessions of the same fixed maze are still different runs — and both
       are reproducible from their seed. */
    return Object.assign(e, { i, out: i === 0, wait: i * 160 + Math.floor(rand() * 90),
                              eaten: false, bob: 0 });
  });

  const phase = Math.floor(rand() * 900);      // where in the chase/scatter cycle we start
  let frames = 0, mouth = 0, fright = 0, combo = 0, regen = 0, grace = 90;
  const g = { w: W, h: H, score: 0, dead: false };

  function eatAt(c, r) {
    if (pellet[r][c]) { pellet[r][c] = false; left--; g.score += 10; }
    else if (power[r][c]) {
      power[r][c] = false; left--; g.score += 50; fright = 420; combo = 0;
      for (const gh of ghosts) if (gh.out && !gh.eaten) reverse(gh);
    }
  }

  function respawnPellet() {
    for (let t = 0; t < 60; t++) {
      const c = Math.floor(rand() * COLS), r = Math.floor(rand() * ROWS);
      if (wall[r][c] || pellet[r][c] || power[r][c]) continue;
      if (r >= 8 && r <= 10 && c >= 7 && c <= 11) continue;      // never inside the pen
      if (c === p.c && r === p.r) continue;
      pellet[r][c] = true; left++; return;
    }
  }

  function target(gh) {
    if (gh.eaten) return PEN;
    if (fright > 0) return CORNER[gh.i];
    if (((frames + phase) % 900) > 660) return CORNER[gh.i];    // periodic scatter
    const d = DV[p.dir];
    if (gh.i === 0) return { c: p.c, r: p.r };
    if (gh.i === 1) return { c: p.c + d[0] * 4, r: p.r + d[1] * 4 };
    if (gh.i === 2) return { c: p.c + d[0] * 2 + (p.c - ghosts[0].c),
                             r: p.r + d[1] * 2 + (p.r - ghosts[0].r) };
    return Math.hypot(gh.c - p.c, gh.r - p.r) > 8 ? { c: p.c, r: p.r } : CORNER[3];
  }

  const ghostPick = gh => e => {
    const tgt = target(gh);
    let best = null, bd = Infinity;
    for (const d of ['u', 'l', 'd', 'r']) {
      if (d === OPP[e.dir]) continue;
      if (!open(e.c, e.r, d, true)) continue;
      const v = DV[d], dist = Math.hypot(wrapC(e.c + v[0]) - tgt.c, e.r + v[1] - tgt.r);
      if (dist < bd) { bd = dist; best = d; }
    }
    return best || OPP[e.dir];
  };

  g.update = function (input) {
    frames++; mouth++;
    if (grace > 0) grace--;
    if (fright > 0 && --fright === 0) combo = 0;
    if (input.dir) { want = input.dir; input.dir = null; }

    if (want && want === OPP[p.dir] && p.prog > 0) { reverse(p); want = null; }
    advance(p, 1.55 / T, () => { const w = want; if (w && open(p.c, p.r, w, false)) want = null; return w; },
            false, e => eatAt(e.c, e.r));
    if (p.prog === 0) eatAt(p.c, p.r);

    /* Once the maze is nearly cleared a pellet returns about every 2.5s in a
       seeded position, so a strong run is ended by the ghosts, not by hunger. */
    if (left < total * 0.2 && ++regen >= 150) { regen = 0; respawnPellet(); }

    for (const gh of ghosts) {
      if (!gh.out) {
        gh.bob++;
        if (gh.wait > 0) { gh.wait--; continue; }
        gh.c = EXIT.c; gh.r = EXIT.r; gh.prog = 0; gh.dir = 'l'; gh.out = true;
        continue;
      }
      const sp = gh.eaten ? 2.7 : (fright > 0 ? 0.95 : 1.33);
      advance(gh, sp / T, ghostPick(gh), true, e => {
        if (e.eaten && e.c === PEN.c && e.r === PEN.r) {
          e.eaten = false; e.c = EXIT.c; e.r = EXIT.r; e.prog = 0; e.dir = 'l';
        }
      });
      if (grace > 0 || gh.eaten) continue;
      if (Math.hypot(px(gh) - px(p), py(gh) - py(p)) < 11) {
        if (fright > 0) { combo = Math.min(combo + 1, 4); g.score += 200 * Math.pow(2, combo - 1); gh.eaten = true; }
        else { g.dead = true; return; }
      }
    }
  };


  /* Re-simulation hook. A compact numeric fingerprint of the current state.
     A server replaying (seed, input log) can compare traces frame by frame and
     find the exact step where a submitted run stops being real. Nothing in the
     interface reads this; it exists for the checker and for the tests. */
  g.trace = () => [p.c, p.r, Math.round(p.prog * 100), p.dir.charCodeAt(0), left,
                   fright, g.score].concat(ghosts.map(gh => gh.c * 32 + gh.r));

  g.render = function (c) {
    c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
    c.strokeStyle = '#2B4DFF'; c.lineWidth = 2; c.lineCap = 'square';
    c.beginPath();
    const solid = (r, cc) => (r < 0 || r >= ROWS || cc < 0 || cc >= COLS) ? true : wall[r][cc];
    for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {
      if (!wall[r][cc]) continue;
      const x = cc * T, y = r * T;
      if (!solid(r - 1, cc)) { c.moveTo(x, y + 1); c.lineTo(x + T, y + 1); }
      if (!solid(r + 1, cc)) { c.moveTo(x, y + T - 1); c.lineTo(x + T, y + T - 1); }
      if (!solid(r, cc - 1)) { c.moveTo(x + 1, y); c.lineTo(x + 1, y + T); }
      if (!solid(r, cc + 1)) { c.moveTo(x + T - 1, y); c.lineTo(x + T - 1, y + T); }
    }
    c.stroke();
    c.strokeStyle = '#FF8AD0'; c.beginPath();
    c.moveTo(DOOR.c * T + 3, DOOR.r * T + T / 2); c.lineTo(DOOR.c * T + T - 3, DOOR.r * T + T / 2);
    c.stroke();

    c.fillStyle = '#FFE9A8';
    for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++)
      if (pellet[r][cc]) c.fillRect(cc * T + 7, r * T + 7, 3, 3);
    const pulse = 4 + Math.sin(frames / 7) * 1.5;
    c.fillStyle = '#FFC91C';
    for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++)
      if (power[r][cc]) { c.beginPath(); c.arc(cc * T + 8, r * T + 8, pulse, 0, 7); c.fill(); }

    for (const gh of ghosts) {
      const x = Math.round(px(gh)), y = Math.round(py(gh)) + (gh.out ? 0 : Math.round(Math.sin(gh.bob / 10) * 2));
      const blue = fright > 0 && !gh.eaten;
      const flash = blue && fright < 120 && Math.floor(fright / 12) % 2 === 0;
      if (!gh.eaten) {
        c.fillStyle = flash ? '#FFF' : blue ? '#2B4DFF' : GC[gh.i];
        c.beginPath();
        c.arc(x, y - 1, 7, Math.PI, 0); c.lineTo(x + 7, y + 6);
        c.lineTo(x + 4.6, y + 2); c.lineTo(x + 2.3, y + 6); c.lineTo(x, y + 2);
        c.lineTo(x - 2.3, y + 6); c.lineTo(x - 4.6, y + 2); c.lineTo(x - 7, y + 6);
        c.closePath(); c.fill();
      }
      const d = DV[gh.dir];
      c.fillStyle = gh.eaten ? '#A8BBEE' : (flash ? '#FF2E3F' : '#FFF');
      c.fillRect(x - 5, y - 4, 4, 5); c.fillRect(x + 1, y - 4, 4, 5);
      if (!flash) {
        c.fillStyle = blue && !gh.eaten ? '#FF2E3F' : '#1B2550';
        c.fillRect(x - 4 + d[0] * 1.5, y - 3 + d[1] * 1.5, 2, 3);
        c.fillRect(x + 2 + d[0] * 1.5, y - 3 + d[1] * 1.5, 2, 3);
      }
    }

    const a = (Math.abs(Math.sin(mouth / 5)) * .30 + .02) * Math.PI;
    const rot = { r: 0, d: Math.PI / 2, l: Math.PI, u: -Math.PI / 2 }[p.dir];
    c.save(); c.translate(Math.round(px(p)), Math.round(py(p))); c.rotate(rot);
    c.fillStyle = (grace > 0 && Math.floor(frames / 8) % 2) ? '#FFE07A' : '#FFC91C';
    c.beginPath(); c.arc(0, 0, 7.5, a, Math.PI * 2 - a); c.lineTo(0, 0); c.fill();
    c.restore();

    if (grace > 0) {
      c.fillStyle = '#FFC91C'; c.font = '9px "Press Start 2P", monospace'; c.textAlign = 'center';
      c.fillText('READY', W / 2, H / 2 - 30);
      c.textAlign = 'left';
    }
  };
  return g;
};


/* ===== src/games/index.js ================================================ */
/* ============================================================================
   99WORLDCUP — GAME MODULES
   The key here must match the key in config/games.js and the key listed in a
   season's `games` array. Nothing else in the project maps names to code.
   ========================================================================== */

const GAME_IMPL = { skyhop, walldrift, mazesnap };


/* ===== src/games/runner.js =============================================== */
/* ============================================================================
   99WORLDCUP — RUNNER
   ----------------------------------------------------------------------------
   One loop, one input model, one submission path for all three games. Games
   never touch the DOM, the clock or the network; they are pure step-and-draw
   modules driven at a fixed 60 Hz.

   INPUT POLICY (read before adding a listener):
     · The canvas is the only element that takes gestures away from the browser.
       It carries touch-action:none in CSS, which is enough on its own — so
       there is no preventDefault() on pointer events anywhere in this file.
     · Nothing is bound to window/document for touch. Scrolling the page,
       swiping back and pull-to-refresh all keep working during a run.
     · Keys are only swallowed while a run is actually live, and only the ones
       the game uses, so Tab, browser shortcuts and screen readers are intact.
   ========================================================================== */

const STEP_MS = 1000 / 60;

/** Shared input. Games read it; they never bind listeners themselves. */
function makeInput(){
  return {
    dir:null,          // 'u'|'d'|'l'|'r' — latest requested direction
    held:{},           // raw key state
    tap:false,         // one-shot press
    py:null,           // pointer Y in logical px
    takeTap(){ const t = this.tap; this.tap = false; return t; },
    clear(){ this.dir = null; this.tap = false; this.py = null; this.held = {}; }
  };
}

function Runner(o){
  const g = GAMES[o.key];
  let game = null, session = null, raf = 0, acc = 0, last = 0;
  let state = 'idle';                     // idle | playing | paused | over
  let log = [], frames = 0, shown = -1, fitPending = 0;

  const setLamp = (s, label) => {
    if (!o.lampEl) return;
    o.lampEl.dataset.s = s;
    o.lampEl.textContent = label;
  };

  /* ---------------------------------------------------------------- layout */
  /* The glass is sized to fit the viewport, so a tall game never pushes its
     own controls off the bottom of a phone. Runs on mount and on resize only. */
  function fitScreen(){
    if (!game || !o.screen) return;
    const ar = game.w / game.h;
    const rect = o.cabinet.getBoundingClientRect();
    const others = o.cabinet.offsetHeight - o.screen.offsetHeight;   // chrome height
    /* On a phone the glass is the show: only the machine above the screen is
       reserved, so the canvas runs wide instead of shrinking to a stamp. The
       deck sits below the fold â€” every game is touch-playable on the glass
       itself (tap / swipe / drag), so nothing is lost mid-run. */
    const reserve = window.matchMedia('(max-width:599px)').matches ? 106 : others + 84;
    const avail = window.innerHeight - rect.top - reserve;
    const byHeight = Math.max(170, avail) * ar;
    o.screen.style.maxWidth = Math.floor(byHeight) + 'px';
  }
  const queueFit = () => {
    cancelAnimationFrame(fitPending);
    fitPending = requestAnimationFrame(fitScreen);
  };

  /* --------------------------------------------------------------- session */
  async function newSession(){
    session = await startSession(o.key);
    if (!session || session.error){ showExpired(); return false; }
    game = GAME_IMPL[o.key](rng(session.seed), session.seed);
    o.canvas.width = game.w; o.canvas.height = game.h;
    log = []; frames = 0; shown = -1;
    setCounter(o.scoreEl, 0);
    queueFit();
    return true;
  }

  function overlayCard(kids){
    o.overlay.hidden = false;
    o.overlay.innerHTML = '';
    kids.filter(Boolean).forEach(k => o.overlay.appendChild(k));
  }

  function showExpired(){
    state = 'over';
    setLamp('over', 'CLOSED');
    overlayCard([
      el('h2', { class:'alarm', text:VERDICT.expired.title }),
      el('p', { class:'muted', text:'This cabinet is not accepting runs right now.' }),
      el('a', { class:'btn btn--play', href:'#/leaderboards', text:'VIEW LEADERBOARDS' })
    ]);
  }

  function ready(){
    state = 'idle';
    setLamp('ready', 'READY');
    const start = el('button', { class:'btn btn--coin', text:'PRESS START', on:{ click:begin } });
    overlayCard([
      el('h2', { text:g.name }),
      el('p', { class:'muted', text:g.tag }),
      start,
      el('p', { class:'tiny muted', text:'SEED ' + session.seed.toString(16).toUpperCase() +
                ' · ' + g.v.toUpperCase() })
    ]);
    start.focus({ preventScroll:true });
    draw();
  }

  function begin(){
    if (state === 'playing') return;
    state = 'playing';
    setLamp('live', 'LIVE');
    o.overlay.hidden = true;
    o.input.clear();
    last = performance.now(); acc = 0;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function pause(why){
    if (state !== 'playing') return;
    state = 'paused';
    setLamp('paused', 'PAUSED');
    cancelAnimationFrame(raf);
    const resume = el('button', { class:'btn btn--coin', text:'RESUME', on:{ click:begin } });
    overlayCard([
      el('h2', { text:'PAUSED' }),
      el('p', { class:'muted', text:why || 'The clock is stopped. Your run is safe.' }),
      resume,
      el('a', { class:'btn btn--sm btn--ghost', href:'#/play', text:'LEAVE GAME' })
    ]);
    resume.focus({ preventScroll:true });
  }

  /* ------------------------------------------------------------------ loop */
  function tick(now){
    if (state !== 'playing') return;
    acc += Math.min(now - last, 250);      // a backgrounded tab must not fast-forward
    last = now;
    let steps = 0;
    while (acc >= STEP_MS && steps < 8){
      game.update(o.input);
      acc -= STEP_MS; steps++; frames++;
      if (frames % 60 === 0) log.push(game.score);      // one sample a second
      if (game.dead){ over(); return; }
    }
    if (game.score !== shown){ shown = game.score; setCounter(o.scoreEl, game.score); }
    draw();
    raf = requestAnimationFrame(tick);
  }

  function draw(){
    const ctx = o.canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    game.render(ctx);
  }

  /* ------------------------------------------------------------ submission */
  async function over(){
    state = 'over';
    cancelAnimationFrame(raf);
    setLamp('over', 'GAME OVER');
    draw();

    const score = game.score;
    log.push(score);
    setCounter(o.scoreEl, score);

    overlayCard([
      el('h2', { class:'alarm', text:'GAME OVER' }),
      el('div', { class:'overlay__score', text:fmt(score) }),
      el('p', { class:'tiny muted', text:'SUBMITTING RUN…' })
    ]);

    let res;
    try {
      res = await submitRun(session, {
        score, endedAt:Date.now(), seed:session.seed,
        gameVersion:g.v, configVersion:g.cfgV,
        playMs:Math.round(frames * STEP_MS), log
      });
    } catch (e){
      res = { verdict:'expired', title:VERDICT.expired.title,
              note:'The scoreboard could not be reached, so this run was not recorded.',
              written:false, digest:'--------' };
    }
    showVerdict(res, score);
  }

  function showVerdict(res, score){
    const again = el('button', { class:'btn btn--coin', text:'PLAY AGAIN',
      on:{ click:async () => { if (await newSession()) begin(); } } });

    if (res.verdict === 'accepted'){
      setCounter(o.bestEl, App.me[o.key + '_b'] || 0);
      overlayCard([
        el('h2', { class:res.pb ? 'coin' : 'alarm', text:res.pb ? 'NEW PERSONAL BEST' : 'GAME OVER' }),
        el('div', { class:'overlay__score', text:fmt(score) }),
        el('span', { class:'verdict verdict--ok', text:VERDICT.accepted.title }),
        el('p', { class:'tiny muted', text:res.written
          ? (App.named ? 'ON THE SEASON BOARD' : 'SAVED — CLAIM A NAME TO APPEAR ON THE BOARD')
          : 'SAVED IN THIS BROWSER ONLY — SCOREBOARD UNREACHABLE' }),
        again,
        el('div', { class:'row', style:'justify-content:center;gap:8px' }, [
          !App.named ? el('a', { class:'btn btn--sm btn--ghost', href:'#/profile', text:'CLAIM A NAME' }) : null,
          el('a', { class:'btn btn--sm btn--ghost', href:'#/leaderboards', text:'LEADERBOARD' })
        ]),
        el('p', { class:'tiny muted', text:'RUN ' + String(res.digest).toUpperCase() })
      ]);
    } else {
      const v = VERDICT[res.verdict] || VERDICT.rejected;
      overlayCard([
        el('h2', { class:res.verdict === 'review' ? 'coin' : 'alarm', text:res.title || v.title }),
        el('div', { class:'overlay__score', text:fmt(score) }),
        el('span', { class:'verdict ' + v.css, text:'NOT ON A LEADERBOARD' }),
        el('p', { class:'muted', text:res.note }),
        again,
        el('a', { class:'btn btn--sm btn--ghost', href:'#/rules', text:'HOW SCORING WORKS' })
      ]);
    }
    again.focus({ preventScroll:true });
  }

  /* ------------------------------------------------------------- listeners */
  const KEYMAP = { ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r',
                   w:'u', s:'d', a:'l', d:'r', W:'u', S:'d', A:'l', D:'r' };

  const onKey = e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P'){
      if (state === 'paused') begin(); else if (state === 'playing') pause();
      e.preventDefault();
      return;
    }
    if (state === 'idle' && (k === ' ' || k === 'Enter')){ e.preventDefault(); begin(); return; }
    if (state !== 'playing') return;
    if (KEYMAP[k]){ o.input.dir = KEYMAP[k]; o.input.held[KEYMAP[k]] = true; e.preventDefault(); }
    if (k === ' '){ o.input.tap = true; e.preventDefault(); }
  };
  const onKeyUp = e => { if (KEYMAP[e.key]) o.input.held[KEYMAP[e.key]] = false; };

  /* Pointer handling lives entirely on the canvas. */
  let drag = null;
  const localY = e => {
    const r = o.canvas.getBoundingClientRect();
    return (e.clientY - r.top) * (game ? game.h / r.height : 1);
  };
  const onDown = e => {
    if (state === 'idle'){ begin(); return; }
    if (state !== 'playing') return;
    o.input.tap = true;
    o.input.py = localY(e);
    drag = { x:e.clientX, y:e.clientY };
    if (o.canvas.setPointerCapture && e.pointerId !== undefined){
      try { o.canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  };
  const onMove = e => {
    if (state !== 'playing') return;
    o.input.py = localY(e);
    if (drag && o.key === 'mazesnap'){
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) > 22 || Math.abs(dy) > 22){
        o.input.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
        drag = { x:e.clientX, y:e.clientY };
      }
    }
  };
  const onUp = () => { drag = null; };
  const onBlur = () => pause('You switched away. The clock is stopped.');
  const onResize = () => queueFit();

  function mount(){
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', onKeyUp);
    o.canvas.addEventListener('pointerdown', onDown);
    o.canvas.addEventListener('pointermove', onMove);
    o.canvas.addEventListener('pointerup', onUp);
    o.canvas.addEventListener('pointercancel', onUp);
    window.addEventListener('blur', onBlur);
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    if (o.pauseBtn) o.pauseBtn.addEventListener('click', () => {
      if (state === 'paused') begin(); else if (state === 'playing') pause(); else if (state === 'idle') begin();
    });
    if (o.actionBtn) o.actionBtn.addEventListener('pointerdown', () => {
      if (state === 'idle') begin(); else if (state === 'playing') o.input.tap = true;
    });
    newSession().then(ok => { if (ok) ready(); });
  }

  function destroy(){
    cancelAnimationFrame(raf);
    cancelAnimationFrame(fitPending);
    state = 'over';
    window.removeEventListener('keydown', onKey);
    window.removeEventListener('keyup', onKeyUp);
    window.removeEventListener('blur', onBlur);
    window.removeEventListener('resize', onResize);
    window.removeEventListener('orientationchange', onResize);
  }

  return { mount, destroy, fit:queueFit, prototype:isPrototype() };
}

/* ===== src/pages/play.js ================================================= */
/* ============================================================================
   99WORLDCUP — GAMEPLAY
   You walk up to a machine: lit marquee, score plate, curved glass, a control
   deck and a coin door. The page furniture gets out of the way entirely.
   ========================================================================== */

/* how wide the machine is allowed to get on a desktop, per game */
const CAB_MAX = { skyhop:460, walldrift:640, mazesnap:520 };

function ViewGame(key){
  const g = GAMES[key];
  if (!g || S.games.indexOf(key) < 0) return ViewNotFound();

  const si = SI();
  if (!si.live){
    return el('div', { class:'shell', style:'padding-top:var(--gap)' }, [
      el('div', { class:'panel panel--alarm state state--err' }, [
        el('div', { class:'state__icon', text:'🔒', 'aria-hidden':'true' }),
        el('h2', { text:si.frozen ? 'SEASON CLOSED' : 'SEASON HAS NOT OPENED' }),
        el('p', { text:si.frozen
          ? 'Season ' + S.id + ' froze on ' + fmtDate(si.end) + '. Its leaderboards are final.'
          : 'Season ' + S.id + ' opens ' + fmtDate(si.start) + '.' }),
        el('a', { class:'btn btn--play', href:'#/leaderboards', text:'VIEW LEADERBOARDS' })
      ])
    ]);
  }

  /* ----------------------------------------------------------- the machine */
  const canvas  = el('canvas', { 'aria-label':g.name + ' game screen', role:'img' });
  const overlay = el('div', { class:'overlay' });
  const screen  = el('div', { class:'screen' }, [
    canvas, el('div', { class:'glass', 'aria-hidden':'true' }), overlay
  ]);

  const scoreEl = Counter(0, { label:'Score' });
  const bestEl  = Counter(App.me[key + '_b'] || 0, { cls:'counter--best', label:'Your best' });
  const lampEl  = el('span', { class:'lamp', 'data-s':'ready', text:'READY' });

  const plates = el('div', { class:'plates' }, [
    el('div', {}, [el('span', { class:'plates__lbl', text:'SCORE' }), scoreEl]),
    el('div', { class:'plates__mid' }, [lampEl]),
    el('div', { class:'plates__end' }, [el('span', { class:'plates__lbl', text:'YOUR BEST' }), bestEl])
  ]);

  const pauseBtn = el('button', { class:'btn btn--sm pausebtn', 'aria-label':'Pause or resume', text:'❚❚' });
  const input = makeInput();
  let actionBtn = null;
  const deck = el('div', { class:'deck' });

  if (key === 'mazesnap'){
    const dpad = el('div', { class:'dpad', role:'group', 'aria-label':'Direction pad' });
    [['u','▲','Up'],['l','◀','Left'],['r','▶','Right'],['d','▼','Down']].forEach(([d, sym, lbl]) => {
      const b = el('button', { class:d, 'aria-label':lbl, text:sym });
      /* pointerdown only — a click would arrive a frame late on touch */
      b.addEventListener('pointerdown', () => { input.dir = d; });
      b.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' '){ input.dir = d; e.preventDefault(); }
      });
      dpad.appendChild(b);
    });
    deck.append(dpad, deckSide(g.hint, pauseBtn));

  } else if (key === 'skyhop'){
    actionBtn = el('button', { class:'action', 'aria-label':'Hop', text:'HOP' });
    deck.append(actionBtn, deckSide(g.hint, pauseBtn));

  } else {
    deck.append(el('div', { class:'deck__hint' }, ['MOVE PADDLE', el('b', { text:g.hint })]),
                el('div', { style:'text-align:right' }, [pauseBtn]));
  }

  const cabinet = el('div', { class:'cabinet', style:'--cab-max:' + (CAB_MAX[key] || 560) + 'px' }, [
    el('div', { class:'cabinet__marquee' }, [
      el('span', { class:'cabinet__name', text:g.name }),
      el('span', { class:'cabinet__badge', text:S.id + ' · ' + g.sub.toUpperCase() })
    ]),
    plates,
    el('div', { class:'cabinet__bezel' }, [screen]),
    deck,
    el('div', { class:'coindoor' }, [
      el('span', { class:'coindoor__slot', 'aria-hidden':'true' }),
      el('span', { text:'INSERT COIN TO BELONG' }),
      el('span', { text:'PLAYER 1' })
    ])
  ]);

  const wrap = el('div', { class:'shell cab-stage' }, [
    cabinet,
    el('div', { class:'cab-foot', style:'--cab-max:' + (CAB_MAX[key] || 560) + 'px' }, [
      el('a', { class:'btn btn--sm btn--ghost', href:'#/play', text:'‹ CABINETS' }),
      el('a', { class:'btn btn--sm btn--ghost', href:'#/leaderboards', text:'LEADERBOARD ›' })
    ]),
    el('div', { class:'panel instructions', style:'--cab-max:' + (CAB_MAX[key] || 560) + 'px' }, [
      Legend('HOW TO PLAY'),
      el('ol', {}, g.how.map(line => el('li', { text:line }))),
      el('p', { class:'tiny muted', style:'margin:12px 0 0' }, [
        seasonLabel() + ' · DAY ' + si.day + ' OF ' + S.days + ' · ',
        el('a', { href:'#/rules', text:'RULES' })
      ]),
      isPrototype() ? el('p', { class:'tiny muted', style:'margin:8px 0 0' }, [
        'PROTOTYPE BUILD: RUNS ARE CHECKED IN THIS BROWSER, NOT ON A SERVER. ',
        el('a', { href:'#/rules', text:'WHAT THAT MEANS' })
      ]) : null
    ])
  ]);

  const runner = Runner({ key, canvas, overlay, screen, cabinet,
                          scoreEl, bestEl, lampEl, pauseBtn, actionBtn, input });
  runner.mount();
  RT.cleanup = runner.destroy;
  return wrap;
}

function deckSide(hint, pauseBtn){
  return el('div', { style:'text-align:right;display:flex;flex-direction:column;gap:10px;align-items:flex-end' }, [
    el('div', { class:'deck__hint' }, ['CONTROLS', el('b', { text:hint })]),
    pauseBtn
  ]);
}


/* ===== src/pages/leaderboards.js ========================================= */
/* ============================================================================
   99WORLDCUP — LEADERBOARDS
   Three games, two periods, top 100. Everything on this page is real: if the
   board is empty it says so rather than showing a plausible-looking table.
   ========================================================================== */

const LB = { game:null, period:'today' };

function ViewBoards(){
  if (!LB.game || S.games.indexOf(LB.game) < 0) LB.game = S.games[0];
  const body = el('div', { class:'panel', style:'padding:0;overflow:hidden' });

  const gameTabs = el('div', { class:'tabs', role:'tablist', 'aria-label':'Game' },
    S.games.map(g => el('button', {
      role:'tab', id:'tab-' + g, 'aria-selected':String(g === LB.game),
      'aria-controls':'lb-body', text:GAMES[g].name,
      on:{ click:() => { LB.game = g; redraw(); } }
    })));

  const periodTabs = el('div', { class:'tabs tabs--sub', role:'tablist', 'aria-label':'Period' },
    [['today','TODAY'],['season','SEASON']].map(p => el('button', {
      role:'tab', 'aria-selected':String(p[0] === LB.period),
      'aria-controls':'lb-body', text:p[1],
      on:{ click:() => { LB.period = p[0]; redraw(); } }
    })));

  function redraw(){
    $$('button', gameTabs).forEach((b, i) =>
      b.setAttribute('aria-selected', String(S.games[i] === LB.game)));
    $$('button', periodTabs).forEach((b, i) =>
      b.setAttribute('aria-selected', String(['today','season'][i] === LB.period)));
    loadBoard(body);
  }

  const wrap = el('div', { class:'shell stack' }, [
    el('div', { class:'pagehead' }, [
      el('h1', { class:'coin', text:'LEADERBOARDS' }),
      el('p', { class:'tiny muted', text:seasonLabel() + ' · ' + S.name })
    ]),
    gameTabs, periodTabs,
    el('div', { id:'lb-body', role:'tabpanel', tabindex:'-1' }, [body]),
    el('p', { class:'tiny muted', style:'text-align:center' },
      ['TOP 100 PLAYERS. ONE HISTORY. ', el('a', { href:'#/rules', text:'HOW RANKING WORKS' })])
  ]);

  loadBoard(body);
  return wrap;
}

async function loadBoard(box){
  const game = LB.game, period = LB.period;
  box.innerHTML = '';
  box.appendChild(Loading('READING THE SCOREBOARD'));

  await whenReady();
  const res = await Board.fetch(game, period);
  if (game !== LB.game || period !== LB.period) return;   // the player switched
  box.innerHTML = '';

  if (res.state === 'error'){
    return box.appendChild(ErrorState('SCOREBOARD OFFLINE',
      'The leaderboard did not answer. Your scores are safe.', () => loadBoard(box)));
  }

  if (res.state === 'offline'){
    const b = App.me[game + '_b'] || 0;
    return box.appendChild(el('div', { class:'state' }, [
      el('div', { class:'state__icon', text:'🔌', 'aria-hidden':'true' }),
      el('h2', { class:'coin', text:'PLAYING SOLO' }),
      el('p', { class:'muted' }, [
        'The shared scoreboard is not available in this view. ',
        b ? 'Your best on ' + GAMES[game].name + ' here is ' + fmt(b) + '.'
          : 'Scores you set are still saved in this browser.'
      ]),
      el('a', { class:'btn btn--play btn--sm', href:'#/play/' + game, text:'PLAY ' + GAMES[game].name })
    ]));
  }

  if (res.state === 'empty'){
    return box.appendChild(el('div', { class:'state' }, [
      el('div', { class:'state__icon', text:'🏆', 'aria-hidden':'true' }),
      el('h2', { class:'coin', text:'NO CHAMPION YET.' }),
      el('p', { class:'muted', text:period === 'today'
        ? 'Nobody has posted a score on ' + GAMES[game].name + ' today. The day resets at 00:00 UTC.'
        : 'Be the first to make history.' }),
      el('a', { class:'btn btn--play btn--sm', href:'#/play/' + game, text:'BE THE FIRST' })
    ]));
  }

  const f = res.field;
  const rows = res.rows.map((r, i) => {
    const rank = i + 1;
    const cls = [rank <= 3 ? 'p' + rank : '', r.id === App.uid ? 'me' : ''].filter(Boolean).join(' ');
    return el('tr', { class:cls }, [
      el('td', { class:'r-rank' }, [rank === 1
        ? el('span', { text:'👑', 'aria-label':'Rank 1' })
        : el('span', { text:'#' + rank })]),
      el('td', { class:'r-name' }, [NameCell(r)]),
      el('td', { class:'r-ctry' }, [
        el('span', { class:'flag', 'aria-hidden':'true', text:r.f || '🏳️' }),
        el('span', { class:'cname', text:r.cn || '—' })
      ]),
      el('td', { class:'r-score', text:fmt(r[f]) })
    ]);
  });

  box.appendChild(el('table', { class:'board' }, [
    el('caption', { text:GAMES[game].name + ' · ' +
      (period === 'today' ? 'TODAY (' + utcDay() + ' UTC)' : 'SEASON ' + S.id + ' — ALL TIME') }),
    el('thead', {}, [el('tr', {}, [
      el('th', { scope:'col', text:'#' }),
      el('th', { scope:'col', text:'PLAYER' }),
      el('th', { scope:'col', text:'COUNTRY' }),
      el('th', { scope:'col', style:'text-align:right', text:'SCORE' })
    ])]),
    el('tbody', {}, rows)
  ]));
}


/* ===== src/pages/profile.js ============================================== */
/* ============================================================================
   99WORLDCUP — PROFILE
   Identity, season stats and badge slots. Badges are minted at freeze and
   stored; they are never recomputed from a live board. Season 01 has not
   frozen, so the slots are empty and the page says why.
   ========================================================================== */

function ViewProfile(){
  const wrap = el('div', { class:'shell stack', style:'padding-top:var(--gap)' });

  const render = () => {
    wrap.innerHTML = '';
    const m = App.me || {};
    const total  = S.games.reduce((a, g) => a + (m[g + '_b'] || 0), 0);
    const played = S.games.reduce((a, g) => a + (m[g + '_n'] || 0), 0);

    wrap.appendChild(el('div', { class:'panel panel--coin' }, [
      el('div', { class:'idcard' }, [
        el('div', { class:'portrait', 'aria-hidden':'true', text:m.f || '👾' }),
        el('div', { class:'stack', style:'gap:8px' }, [
          el('h1', { class:'coin', text:m.h ? m.h : 'UNNAMED PLAYER' }),
          el('p', { class:'muted', style:'margin:0' }, [
            el('span', { class:'flag', 'aria-hidden':'true', text:m.f || '🏳️' }),
            el('span', { text:' ' + (m.cn || 'Country not set') })
          ]),
          el('p', { class:'marker', style:'font-size:19px;margin:6px 0 0', text:'Better games. Better days.' })
        ]),
        el('button', { class:'btn btn--sm', text:m.h ? 'EDIT' : 'SET UP',
                       on:{ click:() => openEditor(render) } })
      ])
    ]));

    wrap.appendChild(el('dl', { class:'statgrid' }, [
      el('div', {}, [el('dt', { text:'SEASONS PLAYED' }), el('dd', { text:played ? '1' : '0' })]),
      el('div', {}, [el('dt', { text:'BEST RANK' }), el('dd', { id:'best-rank', text:'—' })]),
      el('div', {}, [el('dt', { text:'GAMES PLAYED' }), el('dd', { text:fmt(played) })]),
      el('div', {}, [el('dt', { text:'TOTAL BEST' }), el('dd', { text:fmt(total) })])
    ]));

    wrap.appendChild(el('div', { class:'panel stack' }, [
      Legend('BADGES'),
      el('div', { class:'badges' }, S.games.map(g => el('div', { class:'badge badge--empty' }, [
        el('span', { class:'badge__s', text:S.id }),
        el('span', { class:'badge__r', text:'?' }),
        el('span', { class:'badge__g', text:GAMES[g].name })
      ]))),
      el('p', { class:'tiny muted', text:
        'BADGES ARE MINTED WHEN THE SEASON FREEZES ON ' + fmtDate(SI().end).toUpperCase() +
        '. ONE PER GAME, CARRYING YOUR FINAL RANK. THEY CANNOT BE EARNED AGAIN.' })
    ]));

    wrap.appendChild(el('div', { class:'panel stack' }, [
      Legend('GAME STATS · ' + seasonLabel()),
      el('div', { class:'gamestats' }, S.games.map(g => el('div', {}, [
        el('h4', { class:'tube', text:GAMES[g].name }),
        el('div', { class:'num coin', style:'font-size:22px;margin:10px 0 6px', text:fmt(m[g + '_b'] || 0) }),
        el('div', { class:'tiny muted', text:(m[g + '_n'] || 0) + ' RUNS' }),
        el('a', { class:'btn btn--sm btn--ghost', style:'margin-top:10px', href:'#/play/' + g, text:'PLAY' })
      ])))
    ]));

    /* Runs that did not reach a board this session. Plain language only: the
       player is told what happened, not which rule fired. */
    if (App.flagged.length){
      wrap.appendChild(el('div', { class:'panel panel--alarm stack' }, [
        Legend('RUNS NOT COUNTED'),
        el('p', { class:'muted', style:'font-size:19px',
          text:'These runs were not added to any leaderboard.' }),
        el('ul', { style:'margin:0;padding-left:20px' }, App.flagged.map(h =>
          el('li', { style:'font-size:19px;margin-bottom:6px' }, [
            el('span', { class:'coin', text:GAMES[h.game].name + ' ' + fmt(h.score) }),
            el('span', { class:'muted', text:' — ' + h.note })
          ])))
      ]));
    }

    if (!App.online){
      wrap.appendChild(el('div', { class:'notice' }, [
        el('strong', { text:'LOCAL PROFILE. ' }),
        'This view cannot reach the shared scoreboard, so your record lives in this browser only.'
      ]));
    }

    fillBestRank();
    return wrap;
  };

  async function fillBestRank(){
    if (!App.online || !App.me.h) return;
    const out = await Promise.all(S.games.map(g => Board.fetch(g, 'season')));
    let best = null;
    out.forEach(r => {
      const i = r.rows.findIndex(x => x.id === App.uid);
      if (i >= 0 && (best === null || i + 1 < best)) best = i + 1;
    });
    const node = $('#best-rank');
    if (node) node.textContent = best ? '#' + best : '—';
  }

  if (!App.ready) window.addEventListener('99:ready', render, { once:true });
  return render();
}

/* ---------------------------------------------------------------------------
   Identity editor. Everything is validated before it is stored, and the stored
   value is only ever rendered through textContent.
   ------------------------------------------------------------------------- */
function openEditor(done){
  const m = App.me || {};
  const tz = (Intl.DateTimeFormat().resolvedOptions() || {}).timeZone || '';
  const guess = m.c || TZ_HINT[tz] || '';

  const nameIn = el('input', {
    id:'f-name', type:'text', maxlength:'16', value:m.h || '',
    autocomplete:'off', spellcheck:'false', 'aria-describedby':'f-name-help f-name-err'
  });
  const errN = el('p', { class:'err', id:'f-name-err', role:'alert' });
  const sel = el('select', { id:'f-ctry' },
    [el('option', { value:'', text:'— choose —' })].concat(
      COUNTRIES.map(c => el('option', { value:c[0], selected:c[0] === guess ? true : null,
                                        text:c[2] + '  ' + c[1] }))));

  const dlg = el('div', { class:'panel panel--coin stack', role:'dialog',
                          'aria-modal':'false', 'aria-label':'Player identity' }, [
    Legend('PLAYER IDENTITY'),
    el('div', { class:'field' }, [
      el('label', { for:'f-name', text:'DISPLAY NAME' }), nameIn,
      el('p', { class:'tiny muted', id:'f-name-help', text:'3–16 CHARACTERS. LETTERS, NUMBERS, _ AND - ONLY.' }),
      errN
    ]),
    el('div', { class:'field' }, [
      el('label', { for:'f-ctry', text:'COUNTRY' }), sel,
      el('p', { class:'tiny muted', text:guess && !m.c
        ? 'GUESSED FROM YOUR TIME ZONE. CHANGE IT IF IT IS WRONG.'
        : 'SHOWN NEXT TO YOUR NAME ON EVERY BOARD.' })
    ]),
    el('div', { class:'row', style:'gap:10px' }, [
      el('button', { class:'btn btn--coin', text:'SAVE', on:{ click:save } }),
      el('button', { class:'btn', text:'CANCEL', on:{ click:() => done() } })
    ]),
    el('p', { class:'tiny muted' }, ['YOUR NAME AND COUNTRY ARE PUBLIC. NOTHING ELSE IS. ',
      el('a', { href:'#/privacy', text:'PRIVACY' })])
  ]);

  async function save(){
    const raw = nameIn.value.trim();
    const bad = validateName(raw);
    if (bad){ errN.textContent = bad; nameIn.focus(); return; }
    const c = sel.value;
    if (!c){ errN.textContent = 'Pick a country, or "Not saying".'; sel.focus(); return; }
    const row = CMAP[c];
    try {
      const r = await App.savePlayer({ h:raw, c:c, cn:row[1], f:row[2] });
      toast(r.ok ? 'IDENTITY SAVED TO THE SCOREBOARD' : 'SAVED IN THIS BROWSER ONLY', !r.ok);
    } catch (e){ toast('COULD NOT SAVE — TRY AGAIN', true); return; }
    done();
  }

  const host = $('#main .shell') || $('#main');
  host.innerHTML = '';
  host.appendChild(dlg);
  nameIn.focus();
}

/** Username policy, enforced before storage. Anything that gets through here
 *  is still escaped at render time — two layers, on purpose. */
function validateName(s){
  if (s.length < 3) return 'Too short. Minimum 3 characters.';
  if (s.length > 16) return 'Too long. Maximum 16 characters.';
  if (!/^[A-Za-z0-9_-]+$/.test(s))
    return 'Letters, numbers, underscore and hyphen only — no spaces or symbols.';
  if (/^(admin|administrator|mod|moderator|staff|official|system|root|99worldcup|support)/i.test(s))
    return 'That name looks like staff. Pick another.';
  if (/(.)\1{5,}/.test(s)) return 'Too many repeated characters.';
  return null;
}

  return el('div', { class:'shell stack' }, [
    el('div', { class:'pagehead' }, [
      el('h1', { class:'coin', text:'SEASON ARCHIVE' }),
      el('p', { class:'muted', text:'Every season that has ever run, and what it froze.' })
    ]),
    ...rows,
    el('div', { class:'notice' }, [
      el('strong', { text:'ONE SEASON SO FAR. ' }),
      'Season 01 is live and has not frozen yet, so there are no historical rankings ' +
      'to browse. When day 99 ends, this page keeps Season 01 exactly as it finished — ' +
      'permanently, and readable forever.'
    ])
  ]);
}

function ViewSeason(numStr){
  const s = SEASONS.find(x => x.num === parseInt(numStr, 10));
  if (!s) return ViewNotFound();
  const si = Season.info(s);

  const fact = (icon, label, value) => el('div', {}, [
    el('div', { class:'tiny muted' }, [el('span', { 'aria-hidden':'true', text:icon + ' ' }), label]),
    el('div', { class:'factv', text:value })
  ]);

  const champBox = el('div', {}, [
    el('div', { class:'tiny muted' }, [el('span', { 'aria-hidden':'true', text:'👑 ' }), 'CHAMPION']),
    el('div', { class:'factv muted', text:'TBD' })
  ]);

  const view = el('div', { class:'shell stack', style:'padding-top:var(--gap)' }, [
    el('div', { class:'panel panel--coin stack' }, [
      Legend('SEASON ' + String(s.num).padStart(2, '0')),
      el('div', { style:'text-align:center;padding:10px 0 20px;border-bottom:1px solid var(--dim)' }, [
        el('h1', { class:'coin', text:s.name }),
        el('p', { class:'muted', style:'margin-top:12px', text:'A 90s arcade revival.' })
      ]),
      el('div', { class:'facts' }, [
        fact('📅', 'START DATE', fmtDate(si.start)),
        fact('📅', 'END DATE', fmtDate(si.end)),
        fact('🎨', 'THEME', s.theme),
        champBox,
        fact('🏆', 'PLACES', 'TOP 100')
      ]),
      el('hr', { class:'rule' }),
      el('div', {}, [
        el('h4', { class:'tube', text:'GAMES SELECTED' }),
        el('div', { class:'row', style:'margin-top:12px;gap:10px' },
          s.games.map(g => el('a', { class:'btn btn--sm btn--ghost', href:'#/play/' + g,
                                     text:GAMES[g].name })))
      ]),
      el('hr', { class:'rule' }),
      el('div', {}, [
        el('h4', { class:'coin', text:'SEASON STORY' }),
        el('p', { style:'margin-top:12px;max-width:62ch', text:s.story })
      ]),
      el('div', { class:'spread', style:'margin-top:8px' }, [
        el('p', { class:'marker', style:'font-size:22px;margin:0', text:'The Originals. Forever.' }),
        el('a', { class:'btn btn--coin', href:'#/leaderboards', text:'VIEW LEADERBOARD ›' })
      ])
    ]),
    SeasonMeter()
  ]);

  if (si.frozen) champBox.lastChild.textContent = 'SEE ARCHIVE';
  else loadSeasonChamp(champBox, s);
  return view;
}

async function loadSeasonChamp(box, s){
  await whenReady();
  if (!App.online) return;
  const res = await Promise.all(s.games.map(g => Board.fetch(g, 'season')));
  let top = null, topG = null;
  res.forEach((r, i) => {
    const row = r.rows[0];
    if (row && (!top || row[s.games[i] + '_b'] > top[topG + '_b'])){ top = row; topG = s.games[i]; }
  });
  box.lastChild.textContent = '';
  if (!top){ box.lastChild.textContent = 'NO CHAMPION YET'; return; }
  box.lastChild.classList.remove('muted');
  box.lastChild.appendChild(NameCell(top));
}

/* ============================================================================
   99WORLDCUP — RULES
   This page exists because the leaderboard only means something if the rules
   behind it are visible. Every number here matches the code that enforces it.
   Section 8 is the honest limitation. Do not delete it when a backend lands —
   replace it with what the backend actually does.
   ========================================================================== */

function ViewRules(){
  const si = SI();
  const names = S.games.map(g => GAMES[g].name).join(', ');

  return el('div', { class:'shell legal' }, [
    LegalNav('rules'),
    el('article', { class:'panel doc' }, [
      el('h1', { class:'coin', text:'RULES' }),
      el('p', { class:'muted', text:'Season ' + S.id + '. Last updated ' + fmtDate(Date.parse(S.start)) + '.' }),

      el('h3', { text:'1. The season' }),
      el('p', { text:'A season is exactly ' + S.days + ' days. Season 01 opened ' + fmtDate(si.start) +
        ' at 00:00 UTC and closes ' + fmtDate(si.end) + ' at 00:00 UTC. A run that ends before that ' +
        'instant counts. A run that ends at or after it does not — including a run that started on ' +
        'day 99 and finished after the bell.' }),

      el('h3', { text:'2. The three games' }),
      el('p', { text:'Three games are chosen before a season opens and locked for its whole length: ' +
        names + '. They do not rotate, re-roll or change on refresh. Each game keeps its own ' +
        'separate leaderboard.' }),

      el('h3', { text:'3. How a score gets on the board' }),
      el('p', { text:'Starting a game opens a competitive session with its own id, its own random ' +
        'seed and a recorded game version. The seed decides the obstacles, so the same seed always ' +
        'produces the same run — which is what makes a score checkable at all. When the run ends it ' +
        'is submitted once against that session and checked before it is written anywhere.' }),
      el('p', { text:'Checks run against active play time, counted in fixed sixtieths of a second. ' +
        'Pausing, switching tabs or sitting on the start screen is not play time, so none of it ' +
        'helps or hurts you.' }),

      el('h3', { text:'4. The four outcomes' }),
      el('p', { text:'Every submitted run ends in exactly one of these:' }),
      el('ul', {}, [
        el('li', { text:'ACCEPTED — the run is consistent and within what the game can award. It goes on the board.' }),
        el('li', { text:'UNDER REVIEW — the run is possible but outside the expected envelope. It is held back, not deleted, and a human decides.' }),
        el('li', { text:'REJECTED — the run does not match the session it started from. It cannot be counted.' }),
        el('li', { text:'SESSION EXPIRED — the session was no longer live, usually because the season closed or the game sat open for hours. Start a new game.' })
      ]),
      el('p', { text:'A single unusual score is treated as something to look at, not as proof of ' +
        'anything. We do not publish the exact thresholds, because that would hand them to the one ' +
        'person they are meant to stop.' }),

      el('h3', { text:'5. Ranking and ties' }),
      el('p', { text:'Higher score ranks higher. When two players share a score, the one who reached ' +
        'it first ranks higher — being early is the tie-break. Only the top 100 are shown.' }),

      el('h3', { text:'6. Today vs. all time' }),
      el('p', { text:'TODAY shows your best run of the current UTC calendar day and resets at 00:00 ' +
        'UTC for everyone at the same instant, wherever you are. SEASON shows your single best run ' +
        'of the whole ' + S.days + ' days. Today never affects the season board; it is a separate ' +
        'race on the same games.' }),

      el('h3', { text:'7. When the season freezes' }),
      el('p', { text:'At the end of day ' + S.days + ' all three leaderboards freeze permanently. No ' +
        'later run can change a final rank. Final positions are written into badges that name the ' +
        'season, the game, the rank and the score. Season 01 cannot happen twice, so an S01 badge ' +
        'cannot be earned again. Your account, your name and your badges carry into Season 02 — your ' +
        'scores do not. Every season starts at zero.' }),

      el('h3', { text:'8. Names' }),
      el('p', { text:'3 to 16 characters, letters, numbers, underscore and hyphen. Names that ' +
        'impersonate staff are refused. Your name and country are public; nothing else is.' }),

      el('h3', { class:'alarm', text:'9. What this build can and cannot promise' }),
      el('div', { class:'flagnote' }, [
        el('p', { style:'margin:0', text:isPrototype()
          ? 'Honest limitation. This is a prototype build: the game runs, scores itself and writes ' +
            'to the scoreboard entirely inside your browser. The checks in section 3 catch ' +
            'impossible and accidental scores, and they are not cosmetic — but a determined person ' +
            'with developer tools can still forge one. A browser game cannot be made cheat-proof. ' +
            'Making it genuinely hard requires the session seed to be issued by a server and the run ' +
            'to be re-simulated there from the recorded input, which this version does not do yet. ' +
            'Nothing in this interface will ever tell you a score was "verified" when only your own ' +
            'browser checked it. We would rather say that here than claim a fairness we cannot enforce.'
          : 'Sessions are issued by the server and every accepted run is re-simulated there from its ' +
            'seed before it reaches a leaderboard.' })
      ])
    ])
  ]);
}

    toast('PICK A NAME ON YOUR PROFILE TO APPEAR ON THE BOARDS');
  }
});

})();
