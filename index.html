:root{
  color-scheme:dark;

  /* --- structural tokens (season-independent) --- */
  --gap:14px;
  --pad:14px;
  --rule:2px;                  /* the standard cabinet border weight */
  --shell-max:1080px;
  --nav-h:56px;

  /* Fallbacks are deliberate: a monospace face keeps the grid intact while
     the pixel face swaps in, so nothing reflows dramatically. */
  --fx-display:"Press Start 2P","Courier New",ui-monospace,monospace;
  --fx-body:"VT323","Courier New",ui-monospace,monospace;
  --fx-marker:"Permanent Marker","Comic Sans MS",cursive;
}
@media (min-width:600px){ :root{ --gap:18px; --pad:20px; } }
@media (min-width:900px){ :root{ --gap:22px; --pad:26px; } }

/* --- SEASON 01 : THE ORIGINALS (1990s arcade floor) ---
   These sit on :root itself so the palette can never blank out if the season
   attribute is missing. A future season overrides the same names under its own
   [data-season] block; no component hardcodes a Season 01 colour. */
:root,:root[data-season="01"]{
  --void:    #04060E;   /* the unlit arcade at 2am */
  --floor:   #080C1B;
  --cabinet: #0D1430;   /* panel fill */
  --cab-2:   #121A3D;   /* raised panel */
  --coin:    #FFC91C;   /* token brass — the wordmark */
  --coin-dk: #8A6A00;
  --alarm:   #FF2E3F;   /* CRT red — commit actions, season urgency */
  --alarm-dk:#7A0E17;
  --tube:    #3BD7FF;   /* cyan phosphor — info, secondary nav */
  --rail:    #2B4DFF;   /* maze blue — borders, structure */
  --neon:    #C04BFF;   /* magenta — badges, rarity */
  --mint:    #4BFFB0;   /* accepted */
  --ink:     #D5E0FA;   /* body copy */
  --ghost:   #75839F;   /* muted copy */
  --dim:     #3B4666;   /* disabled / hairline */
}

/* ============================================================================
   99WORLDCUP — BASE
   Mobile first. Every size below is the PHONE size; media queries add width,
   they never take it away. Nothing in this file assumes a mouse.
   ========================================================================== */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--ink);
  font-family:var(--fx-body);
  font-size:22px;            /* VT323 runs narrow; 22px reads like ~16px */
  line-height:1.45;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  /* Browser gestures (back-swipe, pull-to-refresh, pinch zoom) stay on.
     Only the game canvas opts out, and only while it is on screen. */
  touch-action:manipulation;
}
@media (min-width:900px){ body{font-size:20px} }

img,canvas{max-width:100%}

/* CRT room: a vignette + fine scanlines over the whole document.
   Not decoration — it is the product's premise (you are inside a cabinet).
   One fixed layer, no animation: costs a single composited paint. */
#crt{
  position:fixed;inset:0;pointer-events:none;z-index:900;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0 1px,transparent 1px 3px),
    radial-gradient(130% 95% at 50% 40%,transparent 42%,rgba(0,0,0,.72) 100%);
  mix-blend-mode:multiply;
}
/* On small screens the scanline pitch would sit under a 3× device pixel
   ratio and shimmer while scrolling. Widen it and drop the multiply. */
@media (max-width:599px){
  #crt{background:radial-gradient(150% 100% at 50% 35%,transparent 46%,rgba(0,0,0,.66) 100%)}
}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--fx-display);font-weight:400;margin:0;line-height:1.4;letter-spacing:.02em}
h1{font-size:20px}
h2{font-size:15px}
h3{font-size:12px}
h4{font-size:10px}
@media (min-width:600px){
  h1{font-size:26px} h2{font-size:17px} h3{font-size:13px} h4{font-size:10px}
}
@media (min-width:900px){ h1{font-size:30px} h2{font-size:19px} }

p{margin:0 0 .75em}
a{color:var(--tube);text-decoration:none}
a:hover{text-decoration:underline}

.mono{font-family:var(--fx-display)}
/* .tiny is the arcade instruction-panel voice. It was the main offender on
   phones, so it is now 10px there and only tightens on large screens. */
.tiny{font-family:var(--fx-display);font-size:10px;line-height:1.8;letter-spacing:.05em}
@media (min-width:900px){ .tiny{font-size:9px;line-height:1.7;letter-spacing:.06em} }
.micro{font-family:var(--fx-display);font-size:9px;line-height:1.7;letter-spacing:.08em}

.muted{color:var(--ghost)}
.coin{color:var(--coin)}
.alarm{color:var(--alarm)}
.tube{color:var(--tube)}
.mint{color:var(--mint)}
.marker{font-family:var(--fx-marker);color:var(--neon);line-height:1.2}
.num{font-family:var(--fx-display);font-variant-numeric:tabular-nums}
.lead{font-size:20px}
@media (min-width:600px){ .lead{font-size:22px} }

/* ---------- focus: always visible, never subtle ---------- */
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.skip{
  position:absolute;left:-9999px;top:0;z-index:999;background:var(--coin);color:#000;
  padding:12px 16px;font-family:var(--fx-display);font-size:11px;
}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================================================================
   99WORLDCUP — LAYOUT
   Shell, the cabinet-panel box, the top marquee and the cabinet base (footer).
   ========================================================================== */

.shell{width:100%;max-width:var(--shell-max);margin:0 auto;padding:0 14px}
@media (min-width:600px){ .shell{padding:0 20px} }
@media (min-width:900px){ .shell{padding:0 24px} }

main{min-height:60vh;padding-bottom:44px}
@media (min-width:600px){ main{padding-bottom:56px} }

.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;gap:var(--gap);flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pagehead{text-align:center;padding-top:var(--gap)}
.pagehead p{margin-top:10px}

/* ---------- panel: the cabinet side-art box with corner bolts ---------- */
.panel{
  position:relative;background:var(--cabinet);
  border:var(--rule) solid var(--rail);
  padding:var(--pad);
}
.panel::before,.panel::after{
  content:"";position:absolute;width:5px;height:5px;background:var(--dim);
  box-shadow:0 0 0 1px rgba(0,0,0,.6);
}
.panel::before{top:5px;left:5px;box-shadow:calc(100% + 6px) 0 0 0 var(--dim),0 0 0 1px rgba(0,0,0,.6)}
.panel::after{bottom:5px;left:5px;box-shadow:calc(100% + 6px) 0 0 0 var(--dim),0 0 0 1px rgba(0,0,0,.6)}
.panel--coin{border-color:var(--coin-dk)}
.panel--alarm{border-color:var(--alarm-dk)}
.panel--flat{background:var(--floor)}
.panel--flat::before,.panel--flat::after{display:none}

/* the stencilled label riveted to the top of an arcade instruction panel */
.legend{
  display:inline-block;font-family:var(--fx-display);font-size:10px;letter-spacing:.1em;
  color:var(--coin);background:var(--void);padding:4px 9px;
  border:1px solid var(--coin-dk);margin-bottom:14px;
  align-self:flex-start;      /* never stretch inside a flex column */
}
@media (min-width:900px){ .legend{font-size:9px} }

hr.rule{border:0;border-top:1px solid var(--dim);margin:0}
.notice{border:var(--rule) dashed var(--dim);padding:14px 16px;color:var(--ghost);font-size:20px}
.notice strong{color:var(--coin);font-weight:400}
@media (min-width:900px){ .notice{font-size:18px} }

/* ---------- top marquee (nav) ----------
   A lit marquee above the cabinet: brass wordmark, red tube underneath. */
.marquee{
  position:sticky;top:0;z-index:600;background:var(--floor);
  border-bottom:var(--rule) solid var(--alarm);
  box-shadow:0 2px 0 rgba(255,46,63,.18);
}
.marquee__in{display:flex;align-items:center;gap:12px;height:var(--nav-h)}
.wordmark{
  font-family:var(--fx-display);font-size:15px;color:var(--coin);
  letter-spacing:-.02em;white-space:nowrap;
  text-shadow:0 2px 0 var(--coin-dk);
}
.wordmark:hover{text-decoration:none;color:#FFE07A}
@media (min-width:600px){ .wordmark{font-size:14px} }

.navlinks{display:flex;gap:4px;margin-left:auto;align-items:center}
.navlinks a{
  font-family:var(--fx-display);font-size:9px;letter-spacing:.06em;
  color:var(--ghost);padding:10px 9px;border-bottom:2px solid transparent;
}
.navlinks a:hover{color:var(--ink);text-decoration:none}
.navlinks a[aria-current="page"]{color:var(--coin);border-bottom-color:var(--coin)}
.navid{display:flex;align-items:center;gap:7px;margin-left:10px;padding-left:12px;border-left:1px solid var(--dim)}
.avatar{
  width:28px;height:28px;border:1px solid var(--dim);background:var(--cab-2);
  display:grid;place-items:center;font-size:16px;line-height:1;
}
.burger{margin-left:auto}

/* Phone / small tablet: the links become a drop-down panel with real targets. */
@media (max-width:899px){
  .navlinks{
    position:absolute;top:var(--nav-h);left:0;right:0;background:var(--floor);
    border-bottom:var(--rule) solid var(--alarm);flex-direction:column;align-items:stretch;
    padding:6px 14px 14px;gap:0;margin-left:0;
    box-shadow:0 14px 26px rgba(0,0,0,.6);
  }
  .navlinks[hidden]{display:none}
  .navlinks a{
    padding:15px 8px;font-size:12px;border-bottom:1px solid var(--dim);
    min-height:48px;display:flex;align-items:center;
  }
  .navid{margin:12px 0 0;border:0;padding:0;font-size:11px}
}
/* .btn sets display:inline-flex in a later stylesheet, so this needs the
   extra specificity to win rather than relying on source order. */
@media (min-width:900px){ .marquee .burger{display:none} }

/* ---------- footer: the cabinet base ---------- */
footer{
  border-top:var(--rule) solid var(--coin-dk);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px),
    linear-gradient(#0A0E1F,#05070F);
  padding:24px 0 28px;margin-top:20px;
}
.foot{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:600px){ .foot{grid-template-columns:1fr 1fr} }
@media (min-width:900px){ .foot{grid-template-columns:1.2fr 1.6fr .9fr;gap:26px} }

.footlinks{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.footlinks a{
  font-family:var(--fx-display);font-size:11px;color:var(--ghost);
  padding:10px 0;letter-spacing:.06em;min-height:44px;display:flex;align-items:center;
}
.footlinks a:hover{color:var(--coin);text-decoration:none}
@media (min-width:900px){ .footlinks a{font-size:9px;padding:6px 0;min-height:0} }

/* the brass plate screwed to the coin door */
.plate{
  border:3px solid #6B5518;background:linear-gradient(160deg,#4A3A10,#241B06);
  padding:14px 16px;text-align:center;font-family:var(--fx-display);font-size:11px;
  color:var(--coin);letter-spacing:.08em;line-height:1.7;position:relative;
}
@media (min-width:900px){ .plate{font-size:10px} }
.plate span{display:block;width:6px;height:6px;background:#8E7429;position:absolute}
.plate .b1{top:5px;left:5px}.plate .b2{top:5px;right:5px}
.plate .b3{bottom:5px;left:5px}.plate .b4{bottom:5px;right:5px}

/* ============================================================================
   99WORLDCUP — COMPONENTS
   Buttons behave like cabinet hardware: they sit on a shadow and travel when
   pressed. Every interactive target is at least 46px tall on a phone.
   ========================================================================== */

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--fx-display);font-size:12px;letter-spacing:.06em;
  padding:15px 20px;min-height:50px;cursor:pointer;
  background:transparent;color:var(--ink);
  border:var(--rule) solid var(--dim);
  text-decoration:none;text-align:center;
  transition:transform .06s steps(2),background-color .1s;
}
@media (min-width:900px){ .btn{font-size:11px;padding:14px 20px;min-height:46px} }
.btn:hover{text-decoration:none;background:rgba(255,255,255,.05)}
.btn:active{transform:translateY(2px)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}

.btn--play{border-color:var(--alarm);color:var(--alarm);background:rgba(255,46,63,.07)}
.btn--play:hover{background:var(--alarm);color:#150003}
.btn--coin{
  border-color:var(--coin);color:#1A1200;background:var(--coin);
  font-size:14px;padding:17px 26px;box-shadow:0 5px 0 var(--coin-dk);
}
@media (min-width:600px){ .btn--coin{font-size:15px;padding:18px 28px} }
.btn--coin:hover{background:#FFE07A}
.btn--coin:active{box-shadow:0 2px 0 var(--coin-dk)}
.btn--ghost{border-color:var(--rail);color:var(--tube)}
.btn--sm{font-size:10px;padding:11px 12px;min-height:44px}
@media (min-width:900px){ .btn--sm{font-size:9px;padding:9px 12px;min-height:36px} }
.btn--wide{width:100%}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:0;border:var(--rule) solid var(--rail);background:var(--void)}
.tabs button{
  flex:1;font-family:var(--fx-display);font-size:11px;letter-spacing:.05em;
  padding:15px 4px;min-height:50px;background:transparent;color:var(--ghost);
  border:0;border-right:1px solid var(--rail);cursor:pointer;
}
@media (min-width:600px){ .tabs button{font-size:11px;letter-spacing:.06em} }
@media (min-width:900px){ .tabs button{padding:14px 6px;min-height:46px} }
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--coin);color:#1A1200}
.tabs--sub button[aria-selected="true"]{background:var(--rail);color:#fff}

/* ---------- the scoreboard ----------
   A tournament board bolted to a wall, not a data table. */
.board{width:100%;border-collapse:collapse;font-family:var(--fx-display);font-size:11px;table-layout:fixed}
@media (min-width:900px){ .board{font-size:10px} }
.board caption{
  caption-side:top;text-align:left;padding:0 0 10px;font-size:10px;
  color:var(--ghost);letter-spacing:.08em;
}
.board th{
  text-align:left;font-weight:400;font-size:9px;letter-spacing:.1em;color:var(--ghost);
  padding:10px 6px;border-bottom:var(--rule) solid var(--rail);
}
.board td{padding:13px 6px;border-bottom:1px solid #131B38;vertical-align:middle}
.board tbody tr:hover{background:rgba(43,77,255,.10)}
.board .r-rank{width:46px;color:var(--ghost)}
.board .r-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .r-score{text-align:right;color:var(--coin);font-variant-numeric:tabular-nums;white-space:nowrap;width:24%}
.board .r-ctry{color:var(--ink);font-size:10px;width:30%;overflow:hidden;white-space:nowrap}
.board .flag{font-family:var(--fx-body);font-size:21px;margin-right:6px;vertical-align:-2px}
.board tr.me{background:rgba(255,201,28,.09);outline:1px solid var(--coin-dk)}
.board tr.p1 td{background:rgba(255,201,28,.07)}
.board tr.p1 .r-rank{color:var(--coin)}
.board tr.p2 .r-rank,.board tr.p3 .r-rank{color:var(--ink)}
@media (max-width:599px){
  .board{font-size:10px}
  .board td{padding:12px 4px}
  .board .r-rank{width:40px}
  .board .r-ctry{width:38px}
  .board .r-ctry .cname{display:none}
  .board .r-score{width:28%}
}

/* ---------- states: loading / error / empty ---------- */
.state{
  display:grid;place-items:center;align-content:center;text-align:center;gap:12px;
  padding:34px 16px;min-height:190px;
}
@media (min-width:600px){ .state{padding:40px 20px;min-height:200px} }
.state h2{letter-spacing:.06em}
.state p{max-width:42ch}
.state--err{border-color:var(--alarm);background:#16040A}
.state--err h2{color:var(--alarm)}
.state__icon{font-size:38px;line-height:1}
@media (min-width:600px){ .state__icon{font-size:42px} }

.bar{width:min(280px,70vw);height:16px;border:1px solid var(--coin-dk);background:var(--void);padding:2px}
.bar i{display:block;height:100%;background:var(--coin);width:20%;animation:load 1.15s steps(10) infinite}
@keyframes load{from{width:4%}to{width:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:55%}}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-family:var(--fx-display);font-size:10px;letter-spacing:.08em;color:var(--ghost)}
.field input,.field select{
  font-family:var(--fx-body);font-size:22px;padding:12px;min-height:50px;
  background:var(--void);border:var(--rule) solid var(--dim);color:var(--ink);
}
.field input:focus,.field select:focus{border-color:var(--coin)}
.err{color:var(--alarm);font-size:19px;min-height:1.4em}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:800;
  background:var(--cabinet);border:var(--rule) solid var(--coin);color:var(--ink);
  padding:13px 16px;font-family:var(--fx-display);font-size:10px;letter-spacing:.05em;
  max-width:92vw;text-align:center;line-height:1.6;
}
.toast--bad{border-color:var(--alarm);color:#FFC2C8}
.toast[hidden]{display:none}

/* ---------- chips / badges ---------- */
.chip{
  display:inline-block;font-family:var(--fx-display);font-size:9px;letter-spacing:.08em;
  padding:6px 8px;border:1px solid var(--dim);color:var(--ghost);margin:2px 4px 2px 0;
}
.chip--live{color:var(--alarm);border-color:var(--alarm)}
.chip--frozen{color:var(--tube);border-color:#1E6C86}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.badge{
  aspect-ratio:3/4;border:var(--rule) solid var(--dim);background:var(--void);
  display:grid;place-content:center;text-align:center;gap:6px;padding:8px;
  font-family:var(--fx-display);
}
.badge--empty{border-style:dashed;color:var(--dim)}
.badge__s{font-size:9px;color:var(--ghost);letter-spacing:.08em}
.badge__r{font-size:18px}
.badge__g{font-size:8px;letter-spacing:.04em}

/* ---------- season meter ---------- */
.meter{height:18px;background:var(--void);border:1px solid var(--alarm-dk);padding:2px;display:flex;gap:2px}
.meter i{flex:1;background:var(--alarm-dk)}
.meter i.on{background:var(--alarm)}
.daycount{font-family:var(--fx-display);font-size:18px;color:var(--coin)}
@media (min-width:600px){ .daycount{font-size:22px} }

/* ---------- legal / documents ---------- */
.legal{display:grid;grid-template-columns:1fr;gap:var(--gap);align-items:start;padding-top:var(--gap)}
@media (min-width:900px){ .legal{grid-template-columns:210px 1fr} }
.legal nav{display:flex;flex-wrap:wrap;border:var(--rule) solid var(--rail)}
.legal nav a{
  font-family:var(--fx-display);font-size:10px;padding:15px 12px;color:var(--ghost);
  letter-spacing:.06em;flex:1 1 auto;text-align:center;min-height:48px;
  display:flex;align-items:center;justify-content:center;
}
@media (min-width:900px){
  .legal nav{flex-direction:column;flex-wrap:nowrap}
  .legal nav a{font-size:9px;text-align:left;justify-content:flex-start;border-bottom:1px solid var(--rail)}
  .legal nav a:last-child{border-bottom:0}
}
.legal nav a[aria-current="page"]{background:var(--coin);color:#1A1200}
.legal nav a:hover{text-decoration:none;color:var(--ink)}
.doc h3{color:var(--coin);margin:26px 0 8px}
.doc h3:first-of-type{margin-top:6px}
.doc p,.doc li{color:var(--ink);max-width:68ch}
.doc ul{padding-left:20px;margin:0 0 .8em}
.flagnote{border-left:3px solid var(--alarm);padding:10px 14px;background:#14060B;color:#FFC2C8;margin:12px 0}

/* ============================================================================
   99WORLDCUP — THE CABINET
   ----------------------------------------------------------------------------
   Gameplay is not a page with a game on it. It is a machine: lit marquee,
   moulded bezel, curved glass, a brass score plate and a control deck.
   Everything here is static CSS — gradients and one inset shadow. Nothing
   animates behind the canvas, because the frame rate belongs to the game.
   ========================================================================== */

.cab-stage{display:flex;flex-direction:column;align-items:center;padding-top:10px}
@media (min-width:600px){ .cab-stage{padding-top:var(--gap)} }

.cabinet{
  width:100%;max-width:var(--cab-max,560px);
  background:linear-gradient(180deg,#121A3D 0%,#0B1128 42%,#070A18 100%);
  border:var(--rule) solid var(--rail);
  box-shadow:0 0 0 1px #000,0 18px 40px rgba(0,0,0,.55);
  padding:0 0 10px;
}

/* ---------- marquee: the lit header above the glass ---------- */
.cabinet__marquee{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 12px;border-bottom:var(--rule) solid var(--coin-dk);
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.20) 0 3px,transparent 3px 7px),
    linear-gradient(180deg,#3A2C05,#1B1403);
}
.cabinet__name{
  font-family:var(--fx-display);font-size:13px;letter-spacing:.06em;color:var(--coin);
  text-shadow:0 0 12px rgba(255,201,28,.55);
}
@media (min-width:600px){ .cabinet__name{font-size:15px} }
.cabinet__badge{font-family:var(--fx-display);font-size:9px;letter-spacing:.1em;color:#B08A28}

/* ---------- bezel + glass ---------- */
.cabinet__bezel{
  padding:12px;
  background:linear-gradient(180deg,#05070F,#0A0F22);
  border-bottom:1px solid #000;
}
@media (min-width:600px){ .cabinet__bezel{padding:16px} }

.screen{
  position:relative;margin:0 auto;background:#000;line-height:0;
  border:3px solid #05070F;border-radius:10px/14px;overflow:hidden;
  box-shadow:0 0 0 2px #1A2348,0 0 34px rgba(43,77,255,.22);
}
.screen canvas{
  display:block;width:100%;height:auto;image-rendering:pixelated;
  /* the canvas is the only element that takes gestures away from the browser */
  touch-action:none;
}

/* curved tube: one static layer of scanlines, a corner falloff and a highlight */
.glass{
  position:absolute;inset:0;pointer-events:none;border-radius:8px/12px;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,.26) 0 1px,transparent 1px 3px),
    radial-gradient(120% 60% at 50% -10%,rgba(190,220,255,.10),transparent 60%);
  box-shadow:inset 0 0 38px rgba(0,0,0,.8),inset 0 0 5px rgba(120,170,255,.16);
}
@media (max-width:599px){
  /* a 1px scanline pitch moirés badly on a 3× phone panel */
  .glass{background:radial-gradient(120% 60% at 50% -10%,rgba(190,220,255,.09),transparent 60%)}
}

.overlay{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:13px;
  background:rgba(4,6,14,.93);padding:18px;line-height:1.45;z-index:2;
}
.overlay[hidden]{display:none}
.overlay h2{color:var(--coin)}
.overlay p{margin:0;max-width:34ch}
.overlay .btn{justify-self:center}
.overlay__score{font-family:var(--fx-display);font-size:28px;color:var(--coin)}

/* verdict chip on the game-over card — plain language, no jargon */
.verdict{
  font-family:var(--fx-display);font-size:10px;letter-spacing:.08em;
  padding:7px 10px;border:1px solid currentColor;justify-self:center;
}
.verdict--ok{color:var(--mint)}
.verdict--review{color:var(--coin)}
.verdict--bad{color:var(--alarm)}

/* ---------- score plate: mechanical counters under the glass ---------- */
.plates{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:10px 12px;border-bottom:1px solid #000;
  background:linear-gradient(180deg,#0E142F,#0A0F24);
}
.plates__lbl{
  font-family:var(--fx-display);font-size:8px;letter-spacing:.12em;color:var(--ghost);
  display:block;margin-bottom:6px;
}
.plates__mid{text-align:center}
.plates__end{text-align:right}
.counter{display:inline-flex;gap:2px}
.counter__d{
  font-family:var(--fx-display);font-size:16px;line-height:1;
  min-width:15px;padding:5px 2px;text-align:center;
  background:#04060E;border:1px solid #1B2348;color:var(--coin);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.04);
}
@media (min-width:600px){ .counter__d{font-size:19px;min-width:17px} }
.counter--best .counter__d{color:var(--tube)}
.counter--sep{border:0;background:none;box-shadow:none;min-width:6px;color:var(--dim)}

/* the run status lamp — READY / LIVE / PAUSED / GAME OVER */
.lamp{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--fx-display);font-size:9px;letter-spacing:.1em;color:var(--ghost);
}
.lamp::before{content:"";width:8px;height:8px;background:var(--dim);box-shadow:0 0 0 1px #000}
.lamp[data-s="live"]{color:var(--mint)}

(function(){

/* ===== src/core/dom.js =================================================== */
/* ============================================================================
   99WORLDCUP — DOM HELPERS
   Everything the interface builds goes through el(). Player-supplied text is
   only ever written as a text node, which is why a display name cannot become
   markup no matter what it contains.
   ========================================================================== */

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/** Kept for any place that must build a string; el() is preferred. */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function el(tag, attrs, kids){
  const n = document.createElement(tag);
  for (const k in (attrs || {})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;            // never called with user data
    else if (k === 'on') for (const e in v) n.addEventListener(e, v[e]);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(kids || [])){
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}

const fmt = n => Number(n || 0).toLocaleString('en-US');

  const t = $('#toast');

  t.hidden = false;

/* ===== src/core/storage.js =============================================== */
/* ============================================================================
   99WORLDCUP — LOCAL STORE
   This browser only: preferences and personal bests. The page must keep
   working when the shared scoreboard is unreachable — it simply becomes a
   single-player cabinet. Never treat anything in here as authoritative.
   ========================================================================== */

const LS_KEY = '99wc.v1';

const Local = {
  read(){
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
    catch (e) { return {}; }
  },
  write(o){ try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) {} },
  patch(o){ const d = this.read(); Object.assign(d, o); this.write(d); return d; }
};

/* ============================================================================
   99WORLDCUP — SEASONS
   A season is 99 days long, its three games are fixed before it opens, and
   its state is derived from UTC instants — never from a flag someone could
   flip. At day 99 + 0ms the leaderboards freeze and stay frozen.
   ========================================================================== */

const DAY_MS = 86400000;

  id:'S01', num:1, name:'THE ORIGINALS', themeKey:'01', theme:'90s ARCADE',
  start:'2026-09-01T00:00:00.000Z', days:99,
  games:['skyhop','walldrift','mazesnap'],
  poster:'🕹️',
  story:'The first season. Three games, ninety-nine days, one hundred places. ' +
        'Nothing here has happened before, which means everything recorded in it ' +
        'is the oldest record the arcade will ever have.'
}];

const Season = {
  all(){ return SEASONS; },
  current(){
    const now = Date.now();
    return SEASONS.find(s => {
      const st = Date.parse(s.start);
      return now >= st && now < st + s.days * DAY_MS;
    }) || null;
  },
  info(s){
    const st = Date.parse(s.start), en = st + s.days * DAY_MS, now = Date.now();

      day:clamp(Math.floor((now - st) / DAY_MS) + 1, 0, s.days),
      live:now >= st && now < en,
      upcoming:now < st,
      frozen:now >= en,
      msLeft:Math.max(0, en - now)
    };
  },
  isOpen(s){ return this.info(s).live; }
};

/* ===== src/core/app.js =================================================== */
/* ============================================================================
   99WORLDCUP — APP STATE
   ----------------------------------------------------------------------------
   Two stores, deliberately separate:
     Local — this browser only. Preferences + personal bests. Survives offline.
     Store — shared across everyone who opens this page. The public board.
   The page must work with Store === null.

   [SERVER] The shared store used here is the artifact host's key/value document
   store. A production deployment replaces `connect()` with its own API client;
   nothing outside this file knows which one it is talking to.
   ========================================================================== */

const bestKeys = () => S.games.map(g => g + '_b');

const App = {
  db:null, uid:null, ready:false,
  me:null,        // the public player record { h, c, cn, f, <game>_b, ... }
  flagged:[],     // runs this session that did not reach a leaderboard

  async boot(){
    const d = Local.read();
    this.me = { h:d.h || '', c:d.c || '', cn:'', f:'', games:0 };
    bestKeys().forEach(k => { this.me[k] = 0; });
    if (d.c && CMAP[d.c]){ this.me.cn = CMAP[d.c][1]; this.me.f = CMAP[d.c][2]; }
    Object.assign(this.me, d.best || {});
    paintIdentity();

    try {
      const [db, user] = await Promise.all([
        window.claude ? claude.use('db')   : null,
        window.claude ? claude.use('user') : null
      ]);
      this.db  = db;
      this.uid = user ? await user.id() : null;
      if (this.db && this.uid){
        const snap = await this.db.doc('players/' + this.uid).get();
        if (snap.exists){
          const v = snap.data();
          this.me = Object.assign(this.me, v);
          const best = {};
          bestKeys().forEach(k => { best[k] = v[k] || 0; });
          Local.patch({ h:v.h, c:v.c, best });
        }
      }
    } catch (e){ /* offline cabinet; nothing to announce */ }

    this.ready = true;
    paintIdentity();
    window.dispatchEvent(new CustomEvent('99:ready'));
  },

  get online(){ return !!(this.db && this.uid); },
  get named(){ return !!(this.me && this.me.h); },

  /** Writes the whole public player record. One write per real change. */
  async savePlayer(patch){
    Object.assign(this.me, patch);
    const best = {};
    bestKeys().forEach(k => { best[k] = this.me[k] || 0; });
    Local.patch({ h:this.me.h, c:this.me.c, best });
    paintIdentity();
    if (!this.online) return { ok:false, reason:'offline' };
    const body = Object.assign({ sid:S.id, upd:new Date().toISOString() }, this.me);
    delete body.id;
    await this.db.doc('players/' + this.uid).set(body);
    return { ok:true };
  }
};

function paintIdentity(){
  const m = App.me || {};
  const name = $('#nav-name'), flag = $('#nav-flag');
  if (name) name.textContent = m.h ? m.h.toUpperCase() : 'GUEST';
  if (flag) flag.textContent = m.f || '👾';
}

/** Resolves once the shared store has been reached (or given up on). */
function whenReady(){
  return App.ready ? Promise.resolve()
                   : new Promise(r => window.addEventListener('99:ready', r, { once:true }));
}


/* ===== src/core/router.js ================================================ */
/* ============================================================================
   99WORLDCUP — ROUTER
   Hash routing, so the whole thing runs from a file:// path or any static host
   with no server rewrites. A view may register a teardown on RT.cleanup; the
   router calls it before the next view mounts (canvas loops rely on this).
   ========================================================================== */

const Routes = [];
const RT = { cleanup:null };
let fallback = () => null;

const route = (re, fn) => Routes.push([re, fn]);
const setFallback = fn => { fallback = fn; };

const NAV_BREAK = 900;

function navigate(){
  if (RT.cleanup){ try { RT.cleanup(); } catch (e) {} RT.cleanup = null; }

  const path = (location.hash.replace(/^#/, '') || '/');
  const main = $('#main');
  main.innerHTML = '';

  let view = null, params = [];
  for (const [re, fn] of Routes){
    const m = path.match(re);
    if (m){ view = fn; params = m.slice(1); break; }
  }

  const out = view ? view.apply(null, params) : fallback();
  if (out) main.appendChild(out);

  $$('#navlinks a').forEach(a => {
    const h = a.getAttribute('href').slice(1);
    const on = h !== '/' && path.indexOf(h) === 0;
    if (on) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });

  if (window.innerWidth < NAV_BREAK) closeNav();
  main.focus({ preventScroll:true });
  window.scrollTo(0, 0);
}

function closeNav(){
  const nav = $('#navlinks'), b = $('#burger');
  if (!nav) return;
  nav.hidden = true;
  if (b) b.setAttribute('aria-expanded', 'false');
}

function mountChrome(){
  const burger = $('#burger');
  if (burger) burger.addEventListener('click', e => {
    const nav = $('#navlinks');
    nav.hidden = !nav.hidden;
    e.currentTarget.setAttribute('aria-expanded', String(!nav.hidden));
  });

  const sync = () => {
    const nav = $('#navlinks');
    if (!nav) return;
    if (window.innerWidth >= NAV_BREAK) nav.hidden = false;
    else closeNav();
  };
  window.addEventListener('resize', sync);
  window.addEventListener('hashchange', navigate);
  sync();
}

/* ===== src/core/board.js ================================================= */
/* ============================================================================
   99WORLDCUP — LEADERBOARD
   Ranking, stated once so every screen agrees:
     1. higher score first
     2. equal scores → whoever reached it first ranks higher (earlier timestamp)
     3. top 100 only
   Rule 2 is a product decision, written on the Rules page rather than buried
   here, because players will ask.
   ========================================================================== */

const Board = {
  async fetch(game, period){
    if (!App.online) return { state:'offline', rows:[] };
    const field = period === 'today' ? game + '_t' : game + '_b';
    try {
      let q = App.db.collection('players');
      q = period === 'today'
        ? q.where(game + '_d', '==', utcDay())
        : q.where('sid', '==', S.id);
      const snap = await q.orderBy(field, 'desc').limit(100).get();
      const rows = snap.docs.map(d => Object.assign({ id:d.id }, d.data()))
        .filter(r => (r[field] || 0) > 0 && r.h)
        .sort((a, b) => (b[field] - a[field]) ||
                        ((a[game + '_bt'] || 0) - (b[game + '_bt'] || 0)))
        .slice(0, 100);
      return { state:rows.length ? 'ok' : 'empty', rows, field };
    } catch (e){
      return { state:'error', rows:[], error:e && e.code };
    }
  }
};

/* ---------------------------------------------------------------------------
   Mechanical counter — the split-flap / odometer digits on an arcade score
   plate. Rebuilt only when the number actually changes.
   ------------------------------------------------------------------------- */
function Counter(value, opts){
  const n = el('span', { class:'counter' + ((opts && opts.cls) ? ' ' + opts.cls : ''),
                         role:'status', 'aria-label':(opts && opts.label) || 'Score' });
  setCounter(n, value, opts && opts.pad);
  return n;
}

function setCounter(node, value, pad){
  const s = fmt(Math.max(0, Math.floor(Number(value) || 0)));
  const want = pad ? s.padStart(pad, '0') : s;
  if (node.dataset.v === want) return;
  node.dataset.v = want;
  node.textContent = '';
  for (const ch of want){
    node.appendChild(el('span', {
      class:'counter__d' + (ch === ',' ? ' counter--sep' : ''),
      'aria-hidden':'true', text:ch
    }));
  }
  node.setAttribute('aria-label', (node.getAttribute('aria-label') || 'Score').split(':')[0] + ': ' + want);
}

/* ===== src/ui/art.js ===================================================== */
/* ============================================================================
   99WORLDCUP — GENERATED ART
   Drawn in code, not stock imagery: no image requests on the critical path and
   nothing to go missing. Both routines are cheap and neither runs during
   gameplay.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   The arcade corridor behind the home hero: a perspective floor and two rows
   of cabinets whose screens flicker on a fixed schedule.
   Renders ONE static frame when the viewer prefers reduced motion or is on a
   phone — a looping canvas is not worth a phone's battery for a backdrop.
   ------------------------------------------------------------------------- */
function corridor(canvas){
  const ctx = canvas.getContext('2d');
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches
             || window.innerWidth < 600;
  let raf = 0, W = 0, H = 0, t = 0;
  const hues = ['#FF2E3F','#3BD7FF','#C04BFF','#FFC91C','#4BFFB0','#2B4DFF'];

  function size(){
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = Math.max(320, r.width); H = Math.max(200, r.height);
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function cabinet(x, y, w, h, hue, lit){
    ctx.fillStyle = '#080B18'; ctx.fillRect(x, y, w, h);                 // body
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
    ctx.fillStyle = hue; ctx.globalAlpha = lit ? .30 : .07;              // marquee
    ctx.fillRect(x + w * .1, y + h * .05, w * .8, h * .09);
    ctx.globalAlpha = lit ? .55 : .13;                                   // screen
    ctx.fillRect(x + w * .14, y + h * .2, w * .72, h * .3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,.55)';                                   // control deck
    ctx.fillRect(x, y + h * .56, w, h * .06);
    ctx.fillStyle = hue; ctx.globalAlpha = lit ? .16 : .05;              // floor glow
    ctx.fillRect(x - w * .2, y + h, w * 1.4, 10);
    ctx.globalAlpha = 1;
  }

  function frame(){
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#04060E'); g.addColorStop(.58, '#0B1024'); g.addColorStop(1, '#05070F');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const vx = W / 2, vy = H * .48;                      // vanishing point
    ctx.strokeStyle = 'rgba(43,77,255,.18)'; ctx.lineWidth = 1;
    for (let i = -8; i <= 8; i++){                       // boards running to the eye
      ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(vx + i * (W / 4.5), H + 40); ctx.stroke();
    }
    for (let i = 1; i <= 8; i++){                        // cross-bands, tighter with distance
      const y = vy + Math.pow(i / 8, 2.4) * (H - vy);
      ctx.globalAlpha = .09 + i * .014;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* Cabinets recede in true perspective: the inner edge rides the sight line
       from the vanishing point, so the centre stays dark and the wordmark
       always has something quiet to sit on. */
    const N = 7;
    for (let i = 1; i <= N; i++){
      const s = Math.pow(i / N, 2.4);
      const inner = vx * (.075 + s * .90);
      const w = 24 + s * (W * .21), h = w * 2.15;
      const floor = vy + s * (H - vy) + 6;
      const y = floor - h;
      const lit = still || ((Math.floor(t / 30) + i * 2) % 5 !== 0);
      cabinet(vx - inner - w, y, w, h, hues[i % hues.length], lit);
      cabinet(vx + inner,     y, w, h, hues[(i + 3) % hues.length], still || !lit);
    }
    ctx.fillStyle = 'rgba(4,6,14,.45)'; ctx.fillRect(0, 0, W, H * .22);
    if (!still){ t++; raf = requestAnimationFrame(frame); }
  }

  size(); frame();
  const onResize = () => { size(); if (still) frame(); };
  window.addEventListener('resize', onResize);
  return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
}

/* ---------------------------------------------------------------------------
   Pixel previews for the select screen. Original art, 120×78, drawn once.
   ------------------------------------------------------------------------- */
function preview(kind, canvas){
  const ctx = canvas.getContext('2d');
  canvas.width = 120; canvas.height = 78;
  const P = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  P(0, 0, 120, 78, '#000');

  if (kind === 'mazesnap'){
    ctx.strokeStyle = '#2B4DFF'; ctx.lineWidth = 2;
    [[8,8,44,22],[60,8,52,22],[8,38,30,32],[46,38,26,14],[80,38,32,32]]
      .forEach(r => ctx.strokeRect(r[0], r[1], r[2], r[3]));
    for (let x = 14; x < 112; x += 12) P(x, 34, 3, 3, '#FFE9A8');
    ctx.fillStyle = '#FFC91C'; ctx.beginPath();
    ctx.arc(36, 60, 9, .35 * Math.PI, 1.65 * Math.PI); ctx.lineTo(36, 60); ctx.fill();
    P(78, 52, 12, 14, '#FF2E3F'); P(80, 55, 3, 4, '#fff'); P(86, 55, 3, 4, '#fff');

  } else if (kind === 'skyhop'){
    P(0, 0, 120, 78, '#123A6B'); P(0, 66, 120, 12, '#2D6B3C');
    P(30, 0, 18, 26, '#3FA34D'); P(28, 24, 22, 6, '#2F7C3A');
    P(30, 50, 18, 16, '#3FA34D'); P(28, 46, 22, 6, '#2F7C3A');
    P(86, 0, 18, 38, '#3FA34D'); P(84, 36, 22, 6, '#2F7C3A');
    P(86, 58, 18, 8, '#3FA34D'); P(84, 54, 22, 6, '#2F7C3A');
    P(58, 32, 12, 10, '#FFC91C'); P(66, 34, 5, 4, '#FF8A1C'); P(60, 34, 3, 3, '#000');

  } else {
    P(6, 26, 5, 26, '#E8F0FF'); P(109, 18, 5, 26, '#E8F0FF');
    P(58, 36, 5, 5, '#fff');
    ctx.strokeStyle = '#3B4666'; ctx.setLineDash([4, 5]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, 4); ctx.lineTo(60, 74); ctx.stroke(); ctx.setLineDash([]);
  }
}

async function loadChampions(box){
  const render = node => {
    box.innerHTML = '';
    box.appendChild(Legend('CURRENT CHAMPIONS'));
    box.appendChild(node);
  };

  await whenReady();

  if (!App.online){
    return render(el('div', { class:'notice' }, [
      el('strong', { text:'SCOREBOARD OFFLINE. ' }),
      'This cabinet is running on its own. Your scores are saved in this browser ' +
      'but nobody else can see them yet.'
    ]));
  }

  const results = await Promise.all(S.games.map(g => Board.fetch(g, 'season')));

  if (results.every(r => r.state === 'error')){
    return render(ErrorState('SCOREBOARD OFFLINE', 'The leaderboard did not answer.',
      () => loadChampions(box)));
  }

  if (!results.some(r => r.rows.length)){
    return render(el('div', { class:'state', style:'min-height:170px;padding:26px 10px' }, [
      el('div', { class:'state__icon', text:'🏆', 'aria-hidden':'true' }),
      el('h3', { class:'coin', text:'NO CHAMPION YET.' }),
      el('p', { class:'muted', text:'Be the first to make history.' }),
      el('a', { class:'btn btn--play btn--sm', href:'#/play', text:'TAKE THE FIRST SCORE' })
    ]));
  }

  render(el('div', { class:'champrow' }, S.games.map((g, i) => {
    const r = results[i].rows[0];
    return el('div', {}, [
      el('h4', { class:'tube', text:GAMES[g].name }),
      r ? el('div', { style:'margin-top:12px' }, [
            el('div', { class:'state__icon', style:'font-size:22px', text:'👑', 'aria-hidden':'true' }),
            el('div', { class:'mono', style:'font-size:11px;margin-top:8px' }, [NameCell(r)]),
            el('div', { class:'num coin', style:'font-size:15px;margin-top:8px', text:fmt(r[g + '_b']) })
          ])
        : el('div', { class:'tiny muted', style:'margin-top:26px', text:'NO CHAMPION YET' })
    ]);
  })));
}
